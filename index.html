<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --petrol: #123F46;
    --petrol-dark: #0a2a2f;
    --petrol-light: #1a5460;
    --petrol-muted: #e8f0f1;
    --cream: #F9F6F0;
    --cream-dark: #ede9e1;
    --text-primary: #123F46;
    --text-secondary: #4a6b6f;
    --text-muted: #7a9a9e;
    --border: #c8d8da;
    --border-strong: #a0bbbe;
    --radius: 10px;
    --bg-success: #EAF3DE;
    --text-success: #27500A;
    --bg-warning: #FAEEDA;
    --text-warning: #633806;
    --bg-danger: #FCEBEB;
    --text-danger: #791F1F;
    font-family: 'Josefin Sans', sans-serif;
  }
  html, body { margin: 0; padding: 0; background: var(--cream-dark); color: var(--text-primary); }
  #app-root {
    max-width: 700px; margin: 0 auto; background: var(--cream);
    min-height: 100vh; padding: 0 0 5rem;
  }
  @media (min-width: 720px) {
    body { padding: 2rem 1rem; background: var(--petrol-dark); }
    #app-root { border-radius: 16px; min-height: auto; box-shadow: 0 4px 24px rgba(0,0,0,0.2); }
  }
  input, select, textarea {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 15px; padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: #fff;
    color: var(--text-primary);
    min-height: 44px;
    width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--petrol); border-color: var(--petrol); }
  button {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 14px; cursor: pointer; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    border-radius: var(--radius); min-height: 44px;
    border: 1.5px solid var(--border-strong);
    background: #fff; color: var(--text-primary);
    padding: 10px 16px;
    transition: all 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; color: #fff; margin: 0; }
  h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; color: #fff; margin: 0; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
  .spinner-dark { border-color: rgba(18,63,70,0.2); border-top-color: var(--petrol); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Header */
  .app-header {
    background: var(--petrol);
    padding: 1.25rem 1.25rem 1rem;
    position: sticky; top: 0; z-index: 10;
  }
  .app-header-top {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;
  }
  .app-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

  /* Nav */
  .nav-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .nav-scroll::-webkit-scrollbar { display: none; }
  .nav-btn {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; font-size: 12px; min-height: 36px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .nav-btn.active {
    background: #fff; color: var(--petrol);
    border-color: #fff; font-weight: 600;
  }

  /* Content */
  .content { padding: 1.25rem; }

  /* Cards */
  .card {
    background: #fff; border-radius: 12px;
    border: 1px solid var(--border);
    padding: 1rem 1.1rem; margin-bottom: 10px;
  }
  .card-muted { background: var(--cream); }

  /* Buttons */
  .btn-primary {
    background: var(--petrol); color: #fff;
    border-color: var(--petrol); width: 100%; padding: 14px;

  .btn-whatsapp { background: #25D366; color: #fff; border-color: #25D366; width: 100%; padding: 13px; }
  .btn-secondary { background: #fff; color: var(--petrol); border-color: var(--border-strong); width: 100%; padding: 13px; }
  .btn-ghost { background: transparent; border: none; color: var(--text-muted); font-size: 12px; }
  .btn-disabled { background: var(--cream-dark); color: var(--text-muted); border-color: var(--border); width: 100%; padding: 14px; cursor: not-allowed; }

  /* Section label */

  /* Badge */

  .product-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }

  .qty-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .qty-btn { width: 34px; height: 34px; padding: 0; min-height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--petrol); color: #fff; border-color: var(--petrol); }
  .qty-input { width: 46px; text-align: center; padding: 6px 4px; min-height: 34px; font-size: 15px; font-weight: 600; border-radius: 8px; }

<body>
<div id="app-root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const BASE_ID = 'appPcdy4HEJuDOF4j';
const STAFF_BASE_ID = 'appVFkDBFTLIsqtlN';
const RESTAURANTS = ['Soller - Groenk Pizza', 'Deia - Groenk Bistro', 'Fornalutx - Groenk Bistro', 'Groenk Production Kitchen Fornalutx'];

// The Production Kitchen has TWO roles, modeled as two separate Locations records:
// - "Retail" role (recZespbXJli9GI4r): it also buys raw ingredients from suppliers and holds
//   its own stock, just like the 3 restaurants — this is the id used for Inventory/Waste below.
// - "Production" role (recdj6jH7StWpJYum): it produces batches for the other units, linked to
//   Production Plan — this id is reserved for the upcoming T+2 auto-order feature, not used yet.
const LOCATION_IDS = {
  'Soller - Groenk Pizza': 'reckUG4DXrJTMYtte',
  'Deia - Groenk Bistro': 'recnoXjgMS7jPYgE7',
  'Fornalutx - Groenk Bistro': 'recyfcAwYYZgFzSyd',
  'Groenk Production Kitchen Fornalutx': 'recZespbXJli9GI4r', // Retail role
};
// ---------- Speed-up helpers (ADDED 2026-09-23) ----------
// Airtable formulas see a linked record by its display name, not its ID, so the
// server-side location filter matches on the Locations table's Name. Client-side
// code still filters by ID exactly as before — the server filter only trims the
// download. Both Production Kitchen location records share the name
// "Production Kitchen", which is harmless for the same reason.
const LOCATION_NAMES = {
  'reckUG4DXrJTMYtte': 'Sóller Pizza',
  'recnoXjgMS7jPYgE7': 'Deià',
  'recyfcAwYYZgFzSyd': 'Fornalutx',
  'recZespbXJli9GI4r': 'Production Kitchen',
};
const LOCATION_FORMULA = (locationId) => {
  const name = LOCATION_NAMES[locationId];
  return name ? `FIND('|${name}|', '|' & ARRAYJOIN({Location}, '|') & '|')` : null;
};
// Date of the full physical inventory that serves as the stock baseline.
const BASELINE_INVENTORY_DATE = '2026-09-21';
const STOCK_TXN_FIELDS = ['Related Product', 'Location', 'Type', 'Quantity', 'Date', 'Notes'];
const SALES_FIELDS = ['Date', 'Units sold', 'Location', 'Menu Item'];
// Every sales-based formula in the app looks back at most 14 days (7-day average,
// last completed Mon-Sun week, PK "most recent day"), so 16 days is a safe window.
const SALES_WINDOW_FORMULA = `IS_AFTER({Date}, DATEADD(TODAY(), -16, 'days'))`;
const andFormula = (...parts) => { const p = parts.filter(Boolean); return p.length ? (p.length === 1 ? p[0] : `AND(${p.join(',')})`) : undefined; };

// Inventory Transactions for one location (or several), only the columns stock
// maths needs. Safety net: if the name-based filter ever returns nothing (e.g. a
// location gets renamed in Airtable), fall back to the full table rather than
// silently showing zero stock everywhere.
async function loadStockTxns(api, locationIds) {
  const parts = (locationIds || []).map(LOCATION_FORMULA).filter(Boolean);
  if (parts.length && parts.length === (locationIds || []).length) {
    const filter = parts.length === 1 ? parts[0] : `OR(${parts.join(',')})`;
    const rows = await api.getAll('Inventory Transactions', { filter, fields: STOCK_TXN_FIELDS });
    if (rows.length) return rows;
  }
  return api.getAll('Inventory Transactions', { fields: STOCK_TXN_FIELDS });
}
async function loadRecentSales(api, locationId) {
  const locFilter = locationId ? LOCATION_FORMULA(locationId) : null;
  if (locFilter) {
    const rows = await api.getAll('Daily Sales', { filter: andFormula(SALES_WINDOW_FORMULA, locFilter), fields: SALES_FIELDS });
    if (rows.length) return rows;
  }
  // Same safety net as loadStockTxns: never let a name mismatch hide all sales.
  return api.getAll('Daily Sales', { filter: SALES_WINDOW_FORMULA, fields: SALES_FIELDS });
}
// Orders matching a formula + only their own Order Items.
async function loadOrdersWithItems(api, filter) {
  const orders = await api.getAll('Orders', { filter });
  const itemIds = orders.flatMap(o => o.fields['Order items'] || []);
  const items = await api.getByIds('Order Items', itemIds);
  return { orders, items };
}

const PRODUCTION_KITCHEN_PRODUCTION_ROLE_ID = 'recdj6jH7StWpJYum'; // Production role — for the T+2 auto-order feature
const PRODUCTION_KITCHEN_SUPPLIER_ID = 'recPXErB7VgvkYd6F'; // "Groenk Production Kitchen" in Suppliers table
const WASTE_REASONS = ['Spoiled', 'Expired', 'Broken', 'Overproduction', 'Staff Food', 'Other'];
const CATEGORY_ORDER = ['Meat & Fish', 'Sauce', 'Bakery, pastry, dessert', 'Extra topping', 'Drink', 'Other'];

// ---------- Shared unit conversion (same logic as production-kitchen-order.js) ----------
const WEIGHT_TO_GRAMS = { g: 1, gr: 1, gramm: 1, kg: 1000 };
const VOLUME_TO_ML = { ml: 1, cl: 10, dl: 100, l: 1000, liter: 1000, litre: 1000 };
const BOTTLE_PRODUCTS = {
  'rec0GG6FuoGVhppOX': { bottleMl: 750, boxBottles: 6 },
  'recr5eRYcQ9DjtF8N': { bottleMl: 750, boxBottles: 12 },
  'recNPOqxkKjbxruPm': { bottleMl: 750, boxBottles: 6 },
  'recfaXavJa7Mfn95b': { bottleMl: 750, boxBottles: 6 },
  'recOur09D12vya1TO': { bottleMl: 750, boxBottles: 6 },
  'recFkhzAQHnJQFOv6': { bottleMl: 750, boxBottles: 6 },
  'recqcp3W6BLYP7HLz': { bottleMl: 750, boxBottles: 6 },
  'recbmyjGTpXCAgRdf': { bottleMl: 750, boxBottles: 6 },
  'recvWB7SPBW8yCbyw': { bottleMl: 750, boxBottles: 6 },
  'rectHW7Se1XBPFbF7': { bottleMl: 750, boxBottles: 6 },
  'recuDpwaPhpDe5Qh0': { bottleMl: 750, boxBottles: 6 },
  'rec5lgdtonSCCuXKn': { bottleMl: 750, boxBottles: 6 },
  'recBZqhgUHiq9bP1d': { bottleMl: 500, boxBottles: 6 },
  'recYff3VN3LLhBP3R': { bottleMl: 700, boxBottles: 6 },
  'recJVtCM5aKx3fkUs': { bottleMl: 700, boxBottles: 6 },
  'recO3hYm1bTCEbHwE': { bottleMl: 750, boxBottles: 6 },
  'recLnrqeL5oKywzpO': { bottleMl: 750, boxBottles: 6 },
  'recrvnmrObLfFgOZO': { bottleMl: 200, boxBottles: 24 }, // Tónica Fever Tree 20cl C-24
  'recLWTdCvXT0VPUoV': { bottleMl: 700, boxBottles: 12 }, // Taroncello
};
const BULK_LITER_PRODUCTS = {
  'recQuqcE97aPWh9gx': 3, 'recQZGUy989QpkbZe': 3, 'recJmkJvH3IRDwWrc': 3, 'recoPQdKRSxB8nKEt': 3,
  'recMaHap0Kptnyc8N': 10,
  'recwIdBFCutoKf1ud': 9, // Metro Chef Leche Entera 1.5L (6 UD) — 6 x 1.5L = 9L per box
};
const KEG_PRODUCTS = { 'recg4kyyl1P4ionxe': 30 };
// ADDED 2026-09-18 (confirmed with Emese): a standing safety-stock floor for
// specific wines/spirits, in the product's own stocking unit (box/caja or
// unit). These items sell slowly enough that a quiet week can make the normal
// "2 x last week's sales" formula say 0 even with nothing physically left (the
// Obalo incident) — this floor makes sure the order never drops below a
// sensible base level regardless of recent sales. Only applies to the Drink
// products listed here; everything else keeps using the plain weekly formula.
const MINIMUM_STOCK_UNITS = {
  'rec0GG6FuoGVhppOX': 2,      // Cruz De Alba Tinto Roble — 2 caja
  'rectHW7Se1XBPFbF7': 2,      // Obalo Rosado — 2 caja
  'recOur09D12vya1TO': 2,      // Paco&Lola Albarino Blanco — 2 caja
  'recr5eRYcQ9DjtF8N': 2,      // K Naia Verdejo-Sauvig Blanc — 2 caja
  'recbmyjGTpXCAgRdf': 2,      // Macia Batle 1856 Negre — 2 caja
  'recqcp3W6BLYP7HLz': 2,      // Mucho Más red wine — 2 caja
  'recfaXavJa7Mfn95b': 2,      // Groenk La Isla Bonita Wine — 2 caja
  'recFkhzAQHnJQFOv6': 2,      // Can Gelat White — 2 caja
  'recvWB7SPBW8yCbyw': 2,      // Can Gelat Gran Vi Red — 2 caja
  'rec5lgdtonSCCuXKn': 1,      // Roda I Reserva — 1 caja
  'recLnrqeL5oKywzpO': 3 / 6,  // Lanson champagne — 3 bottles (6/box)
  'recO3hYm1bTCEbHwE': 3 / 6,  // André Clouet Brut Gran Reserva — 3 bottles (6/box)
  'recTGua3HEngFSkYa': 1,      // Ron Diplomatico — 1 bottle (unit)
  'recUriSKeofDsx7kv': 1,      // Vodka Grey Goose — 1 bottle (unit)
  'recA0GesDatR3B7ry': 1,      // Glenfiddich whisky — 1 bottle (unit)
  'recdqGIw0Ou0Gy5GV': 1,      // Suau 15ys brandy — 1 bottle (unit)
  'recYff3VN3LLhBP3R': 1,      // Pampelle Aperitif — 1 caja
  'recJVtCM5aKx3fkUs': 1,      // Amargero — 1 caja
  'recLWTdCvXT0VPUoV': 4 / 12, // Taroncello — 4 bottles (12/box)
  // Can Gelat Rosé intentionally excluded — sold out, not being reordered.
};
// Spirits poured by the cl/ml (BOM records the shot size) but ORDERED as whole bottles
// (Product Unit = "unit"). Added 2026-08-31 — these fell through convertQty as
// "unreliable" once order suggestions started looking at more than one day of sales.
const SPIRIT_UNIT_ML = {
  'recUriSKeofDsx7kv': 1000, // Vodka Grey Goose 1l
  'recTGua3HEngFSkYa': 700,  // Ron Diplomatico Reserva Exclusiva 0,700
  'recdqGIw0Ou0Gy5GV': 700,  // Suau 15ys brandy (confirmed with Emese 2026-08-31)
  'recA0GesDatR3B7ry': 1000, // Glenfiddich whisky 1l (BOM added 2026-08-31, 4cl/pour)
};

// ---------- Shared ledger helpers ----------
// A physical count (Manual Adjustment with a "Manual count" note) resets the ledger:
// its stored delta was calibrated against whatever existed in Airtable at insertion
// time, and anything else must only apply on/after the count's own date, or a
// backfilled row (e.g. a delayed consumption deduction) gets double-counted. See
// production-kitchen-order.js / daily-consumption-deduction.js for the full
// reasoning (fixed 2026-08-29) — this mirrors the same logic for the app's own
// stock displays and order suggestions, so all three stay consistent.
const LEDGER_EFFECT = (type, qty) => (type === 'Waste' || type === 'Consumption') ? -Math.abs(qty) : qty;
const IS_MANUAL_COUNT = t => t.fields['Type'] === 'Manual Adjustment' && String(t.fields['Notes'] || '').toLowerCase().includes('manual count');

// CHANGED 2026-09-09 (confirmed with Emese): physical stock can never actually be
// negative — if it "ran out," the true value is 0. Every caller (Inventory display,
// New Order suggestions, Today's Prep) now gets a floored-at-0 result, so a deeply
// negative ledger value (unlogged waste, a stale physical count, etc.) can no longer
// inflate an order suggestion or show a confusing negative "in stock" number.
// CHANGED 2026-09-14 (real bug found by Emese): the 2026-09-09 "never negative"
// clamp broke manual stock corrections. saveCount() below needs the TRUE
// (possibly deeply negative) underlying ledger value to compute a correct delta —
// if it instead sees the clamped-to-0 display value, a correction like "set this
// to 2" only nudges the real ledger from e.g. -50 to -48, which still clamps to 0
// on screen, making the count look like it silently failed to save (it didn't —
// it just wasn't enough). Added a `clamp` parameter, default true (every existing
// caller — order suggestions, on-screen "in stock" display — keeps getting the
// safe, floored-at-0 number); only saveCount() now calls this with clamp=false to
// get the real number for its delta math.
function computeCurrentStock(allTxns, productId, locationId, clamp = true) {
  const relevant = allTxns.filter(t => (t.fields['Related Product'] || []).includes(productId) && (t.fields['Location'] || []).includes(locationId));
  let lastCount = null;
  for (const t of relevant) {
    if (IS_MANUAL_COUNT(t) && (!lastCount || t.createdTime > lastCount.createdTime)) lastCount = t;
  }
  if (!lastCount) {
    const raw = relevant.reduce((sum, t) => sum + LEDGER_EFFECT(t.fields['Type'], Number(t.fields['Quantity']) || 0), 0);
    return clamp ? Math.max(0, raw) : raw;
  }
  const baseline = relevant.filter(t => t.createdTime < lastCount.createdTime)
    .reduce((sum, t) => sum + LEDGER_EFFECT(t.fields['Type'], Number(t.fields['Quantity']) || 0), 0)
    + LEDGER_EFFECT(lastCount.fields['Type'], Number(lastCount.fields['Quantity']) || 0);
  const after = relevant.filter(t => t.createdTime > lastCount.createdTime && (t.fields['Date'] || '') >= (lastCount.fields['Date'] || ''));
  const raw = after.reduce((sum, t) => sum + LEDGER_EFFECT(t.fields['Type'], Number(t.fields['Quantity']) || 0), baseline);
  return clamp ? Math.max(0, raw) : raw;
}

function convertQty(qty, fromUnit, toUnit, productId, packSize, weightPerUnitG) {
  const f = String(fromUnit || '').toLowerCase().trim();
  const t = String(toUnit || '').toLowerCase().trim();
  if (f === t) return qty;
  if (WEIGHT_TO_GRAMS[f] && WEIGHT_TO_GRAMS[t]) return qty * WEIGHT_TO_GRAMS[f] / WEIGHT_TO_GRAMS[t];
  if (VOLUME_TO_ML[f] && VOLUME_TO_ML[t]) return qty * VOLUME_TO_ML[f] / VOLUME_TO_ML[t];
  const spiritUnitMl = SPIRIT_UNIT_ML[productId];
  if (spiritUnitMl && t === 'unit') {
    const ml = VOLUME_TO_ML[f] ? qty * VOLUME_TO_ML[f] : null;
    if (ml === null) return null;
    return ml / spiritUnitMl;
  }
  const bottleInfo = BOTTLE_PRODUCTS[productId];
  if (bottleInfo && t.includes('box')) {
    const bottles = f === 'bottle' ? qty : (VOLUME_TO_ML[f] ? (qty * VOLUME_TO_ML[f]) / bottleInfo.bottleMl : qty);
    return bottles / bottleInfo.boxBottles;
  }
  const litersPerBox = BULK_LITER_PRODUCTS[productId];
  if (litersPerBox && (t.includes('box') || t.includes('pack'))) {
    const ml = VOLUME_TO_ML[f] ? qty * VOLUME_TO_ML[f] : qty * 1000;
    return ml / 1000 / litersPerBox;
  }
  const litersPerKeg = KEG_PRODUCTS[productId];
  if (litersPerKeg && VOLUME_TO_ML[f]) return (qty * VOLUME_TO_ML[f]) / 1000 / litersPerKeg;

  // Generic weight-based package conversion, read live from each Product's own
  // "Weight per Unit (g)" field — e.g. Panko (10000 g/bag), Harina (1000 g/bag).
  if (WEIGHT_TO_GRAMS[f] && weightPerUnitG) {
    const grams = qty * WEIGHT_TO_GRAMS[f];
    return grams / weightPerUnitG;
  }

  // Generic count-based package conversion, read live from each Product's own "Pack
  // Size" field — e.g. straws (100/pack), eggs (30/carton), carrots (25/tray).
  const startedAsWeightOrVolume = WEIGHT_TO_GRAMS[f] !== undefined || VOLUME_TO_ML[f] !== undefined;
  if (!startedAsWeightOrVolume && packSize) return qty / packSize;

  // Plain count-unit label mismatches ('piece' vs 'unit') safely pass through 1:1. But if
  // we started from an actual weight/volume amount and found no confident path to the
  // product's own order unit, don't silently pass the raw number through — signal
  // "unreliable" so the caller can skip it instead of showing a wildly wrong suggestion.
  return startedAsWeightOrVolume ? null : qty;
}

// Matches the buffer used in production-kitchen-order.js (confirmed 2026-08-29).
const ORDER_SUGGESTION_BUFFER = 1.5;
// How many days a suggestion must cover until the NEXT expected delivery, keyed off
// each Product's "Shelf Life Code" field (misleadingly named — it actually stores
// order frequency, e.g. "3 – 1x per week", not a shelf-life value). Added 2026-08-31,
// bug found and fixed 2026-09-01 (was reading a nonexistent "Order Frequency" field —
// confirmed via the browser console on Emese's real data that this is the real name):
// previously every non-PK supplier used the same "yesterday's single day of sales"
// basis as the daily Production Kitchen order — fine for a supplier that delivers
// every day, but wrong for a weekly supplier (e.g. Tunel/wine): one noisy day (or a
// day a given item happened not to sell at all) produced a 0 suggestion despite
// steady sales across the week. See conversation 2026-08-31 (Cruz de Alba showing 0
// despite running low).
const ORDER_FREQUENCY_COVERAGE_DAYS = {
  '1 – 6x per week': 1,
  '2 – 3x per week': 3,
  // Confirmed with Emese 2026-09-01: weekly-frequency products (Tunel wine) are
  // always ORDERED on Tuesday and DELIVERED the next day (Wednesday). Stock checked
  // on order day must last from that Tuesday all the way to the FOLLOWING
  // Wednesday's delivery — that's 8 days, not a plain 7-day week.
  '3 – 1x per week': 8,
};
const DEFAULT_COVERAGE_DAYS = 1; // used if a product has no "Shelf Life Code" (order frequency) value set

// Maps an Employees record (Role + Department) to this app's permission level.
function mapEmployeeToAppRole(fields) {
  const role = String(fields['Role'] || '').trim();
  const dept = String(fields['Department'] || '').trim();
  if (role === 'Owner') return 'admin';
  if (role === 'Manager') return 'manager';
  if (role === 'Supervisor' || role === 'Employee') return 'kitchen'; // always kitchen staff, regardless of Department
  if (dept === 'Administration') return 'admin'; // fallback for records with no matching Role
  return 'kitchen';
}
const REST_COLORS = {
  'Soller - Groenk Pizza': { bg: '#DDEEFF', text: '#1a3a6e' },
  'Deia - Groenk Bistro': { bg: '#FCE4D6', text: '#7B2D00' },
  'Fornalutx - Groenk Bistro': { bg: '#EAF3DE', text: '#27500A' },
  'Groenk Production Kitchen Fornalutx': { bg: '#E8E8E8', text: '#333' },
};

function airtable(token, baseId) {
  const base = `https://api.airtable.com/v0/${baseId || BASE_ID}`;
  const h = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
  // CHANGED 2026-09-23 (speed-up): getAll used to download EVERY row of a table,
  // 100 at a time, one request after another (Daily Sales ~9.7k rows, Inventory
  // Transactions ~7.9k, Order Items ~6.7k => hundreds of sequential requests per
  // screen). It now accepts optional server-side filtering so each screen only
  // downloads what it actually uses:
  //   opts.filter  -> Airtable filterByFormula
  //   opts.fields  -> only these columns (smaller payload)
  //   opts.sort    -> [{ field, direction }]
  //   opts.max     -> maxRecords
  // Airtable's 5 requests/second limit is also handled now: a 429 waits and retries
  // instead of failing the whole screen.
  async function fetchWithRetry(url, options) {
    for (let attempt = 0; attempt < 6; attempt++) {
      const r = await fetch(url, options);
      if (r.status !== 429) return r;
      await new Promise(res => setTimeout(res, 1000 * (attempt + 1)));
    }
    return fetch(url, options);
  }
  async function getAll(table, opts = {}) {
    let records = [], offset = null;
    do {
      const params = new URLSearchParams({ pageSize: '100' });
      if (opts.filter) params.set('filterByFormula', opts.filter);
      (opts.fields || []).forEach(f => params.append('fields[]', f));
      (opts.sort || []).forEach((srt, i) => {
        params.set(`sort[${i}][field]`, srt.field);
        params.set(`sort[${i}][direction]`, srt.direction || 'asc');
      });
      if (opts.max) params.set('maxRecords', String(opts.max));
      if (offset) params.set('offset', offset);
      const r = await fetchWithRetry(`${base}/${encodeURIComponent(table)}?${params.toString()}`, { headers: h });
      const d = await r.json();
      if (d.error) throw new Error(d.error.message || d.error.type || String(d.error));
      records = records.concat(d.records); offset = d.offset;
    } while (offset);
    return records;
  }
  // Fetch specific records by ID (e.g. only the Order Items of the orders on
  // screen, instead of all ~6.7k). Chunked to keep the URL short; a few chunks
  // run in parallel.
  async function getByIds(table, ids, opts = {}) {
    const unique = [...new Set(ids || [])];
    if (!unique.length) return [];
    const chunks = [];
    for (let i = 0; i < unique.length; i += 40) chunks.push(unique.slice(i, i + 40));
    const out = [];
    for (let i = 0; i < chunks.length; i += 3) {
      const batch = await Promise.all(chunks.slice(i, i + 3).map(c =>
        getAll(table, { ...opts, filter: `OR(${c.map(id => `RECORD_ID()='${id}'`).join(',')})` })
      ));
      batch.forEach(b => out.push(...b));
    }
    return out;
  }
  async function create(table, fields) {
    const r = await fetch(`${base}/${encodeURIComponent(table)}`, { method: 'POST', headers: h, body: JSON.stringify({ records: [{ fields }] }) });
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    return d.records[0];
  }
  async function update(table, id, fields) {
    const r = await fetch(`${base}/${encodeURIComponent(table)}/${id}`, { method: 'PATCH', headers: h, body: JSON.stringify({ fields }) });
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    return d;
  }
  async function createMany(table, fieldsArray) {
    const chunks = [];
    for (let i = 0; i < fieldsArray.length; i += 10) chunks.push(fieldsArray.slice(i, i + 10));
    const results = [];
    for (const chunk of chunks) {
      const r = await fetch(`${base}/${encodeURIComponent(table)}`, { method: 'POST', headers: h, body: JSON.stringify({ records: chunk.map(f => ({ fields: f })) }) });
      const d = await r.json();
      if (d.error) throw new Error(d.error.message);
      results.push(...d.records);
    }
    return results;
  }
  return { getAll, getByIds, create, update, createMany };
}

function AccessCodeScreen({ staffApi, onLogin }) {
  const [code, setCode] = useState('');
  const [checking, setChecking] = useState(false);
  const [error, setError] = useState('');
  const [pendingEmployee, setPendingEmployee] = useState(null); // set when a location choice is needed

  function employeeLocations(fields) {
    const raw = fields['Location'];
    const list = Array.isArray(raw) ? raw : (raw ? [raw] : []);
    return list.filter(l => RESTAURANTS.includes(l));
  }

  async function submit() {
    const trimmed = code.trim();
    if (!trimmed) return;
    setChecking(true); setError('');
    try {
      const employees = await staffApi.getAll('Employees');
      const match = employees.find(e => (e.fields['Access Code'] || '').trim() === trimmed && e.fields['Active'] !== false);
      if (!match) { setError('Code not recognized, or account inactive.'); return; }
      const locations = employeeLocations(match.fields);
      if (!locations.length) {
        setError('This employee has no matching restaurant location set up. Contact admin.');
        return;
      }
      if (locations.length === 1) {
        onLogin({ name: match.fields['Name'] || 'Staff', role: mapEmployeeToAppRole(match.fields), restaurant: locations[0] });
      } else {
        setPendingEmployee({ fields: match.fields, locations });
      }
    } catch(e) { setError('Error: ' + e.message); }
    finally { setChecking(false); }
  }

  function pickLocation(loc) {
    onLogin({ name: pendingEmployee.fields['Name'] || 'Staff', role: mapEmployeeToAppRole(pendingEmployee.fields), restaurant: loc });
  }

  if (pendingEmployee) {
    return (
      <div>
        <div className="app-header">
          <div className="app-header-top">
            <div><h1>Grøenk</h1><div className="app-subtitle">Procurement</div></div>
          </div>
        </div>
        <div className="content" style={{ maxWidth: 380, margin: '1rem auto' }}>
          <div className="section-label" style={{ marginBottom: 10 }}>Which location are you working today?</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {pendingEmployee.locations.map(loc => (
              <button key={loc} className="btn-secondary" onClick={() => pickLocation(loc)}>{loc}</button>
            ))}
          </div>
          <button className="btn-ghost" style={{ marginTop: 14, width: '100%' }} onClick={() => setPendingEmployee(null)}>
            ← Back
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="app-header">
        <div className="app-header-top">
          <div><h1>Grøenk</h1><div className="app-subtitle">Procurement</div></div>
        </div>
      </div>
      <div className="content" style={{ maxWidth: 380, margin: '1rem auto' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div>
            <div className="section-label">Access code</div>
            <input
              type="password" inputMode="numeric" maxLength={5} autoFocus
              placeholder="5-digit code" value={code}
              onChange={e => setCode(e.target.value.replace(/[^0-9]/g, ''))}
              onKeyDown={e => { if (e.key === 'Enter') submit(); }}
              style={{ textAlign: 'center', fontSize: 24, letterSpacing: '0.3em', padding: '16px' }}
            />
          </div>
          {error && <div style={{ color: 'var(--text-danger)', fontSize: 13 }}>{error}</div>}
          <button className="btn-primary" style={{ marginTop: 8 }} onClick={submit} disabled={!code || checking}>
            {checking ? <span className="spinner"></span> : 'Sign in'}
          </button>
          <div style={{ fontSize: 12, color: 'var(--text-muted)', textAlign: 'center' }}>
            Same code you use for Grøenk Staff.
          </div>
        </div>
      </div>
    </div>
  );
}

function NewOrderScreen({ user, api }) {
  const [suppliers, setSuppliers] = useState([]);
  const [products, setProducts] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [dailySales, setDailySales] = useState([]);
  const [invTxns, setInvTxns] = useState([]);
  const [supplierId, setSupplierId] = useState('');
  const [quantities, setQuantities] = useState({});
  const [suggested, setSuggested] = useState({});
  const [skippedCount, setSkippedCount] = useState(0);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [sent, setSent] = useState(null);
  const [orderText, setOrderText] = useState('');

  useEffect(() => {
    async function load() {
      try {
        const locId = LOCATION_IDS[user.restaurant];
        const [sups, prods, bom, sales, txns] = await Promise.all([
          api.getAll('Suppliers'), api.getAll('Products'), api.getAll('Recipes (BOM)'),
          loadRecentSales(api, locId), loadStockTxns(api, locId ? [locId] : null),
        ]);
        setSuppliers(sups);
        setProducts(prods.filter(p => p.fields['Active'] !== false));
        setRecipes(bom);
        setDailySales(sales);
        setInvTxns(txns);
        if (sups.length) setSupplierId(sups[0].id);
      } catch(e) { alert('Error: ' + e.message); }
      finally { setLoading(false); }
    }
    load();
  }, []);

  const supplier = suppliers.find(s => s.id === supplierId);
  const filteredProducts = products.filter(p => (p.fields['Supplier'] || []).includes(supplierId));
  const isProductionKitchen = supplierId === PRODUCTION_KITCHEN_SUPPLIER_ID;
  const userLocationId = LOCATION_IDS[user.restaurant];

  // ---------- Current stock (physical-count-aware) ----------
  // Fixed 2026-08-29: a plain chronological sum double-counts consumption whenever a
  // physical count gets entered LATE and a day's consumption then gets backfilled
  // afterward for a date before that count — the count already reflects that
  // consumption in the real world, so re-applying it subtracts twice. See the same
  // fix in production-kitchen-order.js / daily-consumption-deduction.js for the full
  // reasoning. The baseline uses INSERTION order (createdTime) to reconstruct what
  // the count's delta was calibrated against; anything applied on top must be dated
  // on/after the count's own date.
  function currentStock(productId) {
    return computeCurrentStock(invTxns, productId, userLocationId);
  }

  // Computes a suggested order quantity per product for this supplier. For
  // Production Kitchen (daily delivery) this stays out of scope entirely — that
  // supplier keeps its own dedicated formula in production-kitchen-order.js
  // (yesterday's single day of sales x 1.5, since "tomorrow" is always the target).
  // For every other supplier (updated 2026-08-31): average daily sales over the last
  // 7 days (not a single day — a supplier with weekly delivery shouldn't be judged on
  // one noisy day), x each product's own coverage window (from its "Shelf Life Code"
  // field, which actually stores order frequency —
  // a weekly-delivery wine needs to last 7 days until the next order, not 1) x the
  // same 1.5 buffer, minus current stock, rounded up.
  function computeSuggestions() {
    if (isProductionKitchen || !userLocationId) return { result: {}, unreliableCount: 0 };
    const unreliableProducts = new Set();
    const salesHere = dailySales.filter(s => (s.fields['Location'] || []).includes(userLocationId));

    const supplierProductIds = new Set(filteredProducts.map(p => p.id));
    const productUnitById = Object.fromEntries(products.map(p => [p.id, p.fields['Unit'] || 'unit']));
    const productPackSizeById = Object.fromEntries(products.map(p => [p.id, p.fields['Pack Size']]));
    const productWeightPerUnitById = Object.fromEntries(products.map(p => [p.id, p.fields['Weight per Unit (g)']]));
    const productCoverageDaysById = Object.fromEntries(products.map(p => [p.id, ORDER_FREQUENCY_COVERAGE_DAYS[p.fields['Shelf Life Code']] || DEFAULT_COVERAGE_DAYS]));
    const productIsDrink = Object.fromEntries(products.map(p => [p.id, p.fields['Order Category'] === 'Drink']));

    // ---------- Non-drink products: unchanged — 7-day rolling average x order-frequency coverage days x 1.5 buffer ----------
    const allDates = [...new Set(salesHere.map(s => s.fields['Date']).filter(Boolean))].sort().reverse();
    const recentDates = allDates.slice(0, 7);
    const recentSales = salesHere.filter(s => recentDates.includes(s.fields['Date']));
    const daysCovered = recentDates.length || 1;
    const salesByMenuItem7d = {};
    for (const s of recentSales) {
      const units = Number(s.fields['Units sold']) || 0;
      for (const miId of (s.fields['Menu Item'] || [])) (salesByMenuItem7d[miId] = salesByMenuItem7d[miId] || []).push(units);
    }
    const avgUnitsSold = {};
    for (const [miId, arr] of Object.entries(salesByMenuItem7d)) avgUnitsSold[miId] = arr.reduce((a,b)=>a+b, 0) / daysCovered;

    // ---------- Drink products: last COMPLETED Monday-Sunday week's raw total ----------
    // CHANGED 2026-09-13 (confirmed with Emese): drink products (wine, beer, soft
    // drinks, spirits, coffee, everything with Order Category = "Drink") don't spoil
    // on the shelf, so they no longer use the order-frequency/coverage-days formula
    // above. Instead: order = ceil(max(0, 2 x last week's total sold - current stock)),
    // in the product's own stocking unit (so a wine sold by the glass or bottle still
    // converts to boxes the same way it always has via convertQty/BOTTLE_PRODUCTS).
    // "Last week" always means the most recently COMPLETED Monday-Sunday week,
    // regardless of which day of the current week the order screen is opened on —
    // so opening it Monday, Tuesday, or any other day this week shows the same
    // suggestion, based on the week that just finished.
    function lastCompletedWeekRange(today) {
      const daysSinceMonday = (today.getDay() + 6) % 7; // 0 if today is itself Monday
      const thisWeekMonday = new Date(today);
      thisWeekMonday.setDate(today.getDate() - daysSinceMonday);
      const lastWeekSunday = new Date(thisWeekMonday);
      lastWeekSunday.setDate(thisWeekMonday.getDate() - 1);
      const lastWeekMonday = new Date(lastWeekSunday);
      lastWeekMonday.setDate(lastWeekSunday.getDate() - 6);
      return { startStr: lastWeekMonday.toISOString().slice(0, 10), endStr: lastWeekSunday.toISOString().slice(0, 10) };
    }
    const { startStr: lastWeekStart, endStr: lastWeekEnd } = lastCompletedWeekRange(new Date());
    const lastWeekSales = salesHere.filter(s => {
      const d = s.fields['Date'];
      return d && d >= lastWeekStart && d <= lastWeekEnd;
    });
    const salesByMenuItemLastWeek = {};
    for (const s of lastWeekSales) {
      const units = Number(s.fields['Units sold']) || 0;
      for (const miId of (s.fields['Menu Item'] || [])) {
        salesByMenuItemLastWeek[miId] = (salesByMenuItemLastWeek[miId] || 0) + units;
      }
    }

    // ---------- Convert menu-item sales to product-level demand via BOM (both tracks) ----------
    const avgConsumption = {};      // non-drink: per-day average, in product's stocking unit
    const weeklyConsumption = {};   // drink: last completed week's raw total, in product's stocking unit
    for (const r of recipes) {
      const compIds = (r.fields['Component (Product)'] || []).filter(id => supplierProductIds.has(id));
      if (!compIds.length) continue;
      const qtyPerUnit = Number(r.fields['Quantity per unit']) || 0;
      const bomUnit = r.fields['Unit'] || 'unit';
      for (const miId of (r.fields['Menu Item'] || [])) {
        for (const productId of compIds) {
          const converted = convertQty(qtyPerUnit, bomUnit, productUnitById[productId], productId, productPackSizeById[productId], productWeightPerUnitById[productId]);
          if (converted === null) { unreliableProducts.add(productId); continue; }
          if (productIsDrink[productId]) {
            const weekUnits = salesByMenuItemLastWeek[miId];
            if (!weekUnits) continue;
            weeklyConsumption[productId] = (weeklyConsumption[productId] || 0) + weekUnits * converted;
          } else {
            const avgUnits = avgUnitsSold[miId];
            if (!avgUnits) continue;
            avgConsumption[productId] = (avgConsumption[productId] || 0) + avgUnits * converted;
          }
        }
      }
    }

    const result = {};
    for (const [productId, avgPerDay] of Object.entries(avgConsumption)) {
      const coverageDays = productCoverageDaysById[productId] || DEFAULT_COVERAGE_DAYS;
      const par = avgPerDay * coverageDays * ORDER_SUGGESTION_BUFFER;
      const qty = Math.max(0, Math.ceil(par - currentStock(productId)));
      if (qty > 0) result[productId] = qty;
    }
    // Make sure every product with a minimum-stock floor gets checked even if
    // it had zero sales last week (otherwise it would never enter
    // weeklyConsumption at all, and the floor below would never apply — this
    // is exactly the Obalo bug this floor exists to fix).
    // FIX 2026-09-23: only products of THIS supplier may get a minimum-stock
    // floor here — otherwise Tunel wines/spirits leak into other suppliers' orders.
    for (const productId of Object.keys(MINIMUM_STOCK_UNITS)) {
      if (!supplierProductIds.has(productId)) continue;
      if (!(productId in weeklyConsumption)) weeklyConsumption[productId] = 0;
    }
    for (const [productId, weekTotal] of Object.entries(weeklyConsumption)) {
      const stock = currentStock(productId);
      const minimum = MINIMUM_STOCK_UNITS[productId] || 0;
      const qty = Math.max(0, Math.ceil(Math.max(2 * weekTotal, minimum) - stock));
      if (qty > 0) result[productId] = qty;
    }
    return { result, unreliableCount: unreliableProducts.size };
  }

  useEffect(() => {
    if (loading) return;
    const { result, unreliableCount } = computeSuggestions();
    setSuggested(result);
    setSkippedCount(unreliableCount);
    setQuantities(Object.fromEntries(Object.entries(result).map(([id, qty]) => [id, String(qty)])));
  }, [supplierId, loading]);

  const bump = (pid, delta) => {
    const next = Math.max(0, Number(quantities[pid] || 0) + delta);
    setQuantities(q => ({ ...q, [pid]: next === 0 ? '' : String(next) }));
  };
  const orderLines = filteredProducts.filter(p => quantities[p.id] && Number(quantities[p.id]) > 0)
    .map(p => `${quantities[p.id]} x ${p.fields['Name']} (${p.fields['Unit'] || ''})`);
  const today = new Date().toISOString().slice(0,10);
  const message = supplier ? `Order for ${supplier.fields['Name']}\nRestaurant: ${user.restaurant}\nDate: ${today}\nRequested by: ${user.name}\n\n${orderLines.join('\n')}` : '';

  async function saveOrder() {
    if (!orderLines.length) return;
    setSaving(true);
    try {
      const order = await api.create('Orders', { 'Order Date': today, 'Supplier': [supplierId], 'Restaurant': user.restaurant, 'Status': 'Pending', 'Created By': user.name });
      await api.createMany('Order Items', filteredProducts.filter(p => quantities[p.id] && Number(quantities[p.id]) > 0)
        .map(p => ({ 'Order': [order.id], 'Product': [p.id], 'Quantity': Number(quantities[p.id]), 'Received': false, 'Invoice Match': 'Pending Review' })));
      setOrderText(message); setQuantities({});
    } catch(e) { alert('Error: ' + e.message); }
    finally { setSaving(false); }
  }

  if (loading) return <div className="content"><Loader /></div>;
  return (
    <div className="content">
      <div style={{ marginBottom: '1.25rem' }}>
        <div className="section-label">Supplier</div>
        <select value={supplierId} onChange={e => { setSupplierId(e.target.value); setSent(null); setOrderText(''); }}>
          {suppliers.map(s => <option key={s.id} value={s.id}>{s.fields['Name']}</option>)}
        </select>
        {isProductionKitchen && (
          <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 6 }}>
            Production Kitchen orders are handled by the kitchen's own "Today's prep" screen each morning — no suggestions here, but you can still add extra items manually.
          </div>
        )}
        {!isProductionKitchen && skippedCount > 0 && (
          <div style={{ fontSize: 12, color: 'var(--text-warning)', marginTop: 6 }}>
            {skippedCount} product{skippedCount > 1 ? 's' : ''} on this list don't have a reliable suggestion yet (package size not set up) — enter those manually.
          </div>
        )}
      </div>

      {filteredProducts.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)', fontSize: 14 }}>
          No products for this supplier.<br/>Add them in Airtable.
        </div>
      ) : (
        <div>
          {/* CHANGED 2026-09-02: grouped by each Product's "Order Category" (Meat & Fish,
              Sauce, Bakery/pastry/dessert, Extra topping, Drink, Other), same CATEGORY_ORDER
              and grouping logic already used in InventoryScreen and PrepScreen — this screen
              was the one place still showing a flat, uncategorized list. Falls back to a
              single flat list if none of this supplier's products have a category set. */}
          {(() => {
            const hasCategories = filteredProducts.some(p => p.fields['Order Category']);
            const byName = (a, b) => (a.fields['Name'] || '').trim().localeCompare((b.fields['Name'] || '').trim());
            const groups = hasCategories
              ? CATEGORY_ORDER.map(cat => ({ cat, items: filteredProducts.filter(p => (p.fields['Order Category'] || 'Other') === cat).sort(byName) })).filter(g => g.items.length)
              : [{ cat: null, items: [...filteredProducts].sort(byName) }];
            return groups.map(g => (
              <div key={g.cat || 'all'}>

                    {g.cat}
                  </div>
                )}
                {g.items.map(p => {
                  const isSuggested = suggested[p.id] !== undefined && quantities[p.id] === String(suggested[p.id]);
                  return (
                    <div key={p.id} className="product-row">
                      <div>
                        <div className="product-name">{p.fields['Name']}</div>
                        <div className="product-unit">
                          {p.fields['Unit']}
                          {isSuggested && <span style={{ marginLeft: 6, color: 'var(--petrol)', fontWeight: 700 }}>· suggested</span>}
                        </div>
                      </div>
                      <div className="qty-controls">
                        <button className="qty-btn" onClick={() => bump(p.id, -1)}><i className="ti ti-minus" style={{ fontSize: 14 }}></i></button>
                        <input type="text" inputMode="numeric" placeholder="0" value={quantities[p.id] || ''} onChange={e => setQuantities(q => ({ ...q, [p.id]: e.target.value.replace(',', '.') }))} className="qty-input" />
                        <button className="qty-btn" onClick={() => bump(p.id, 1)}><i className="ti ti-plus" style={{ fontSize: 14 }}></i></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            ));
          })()}
        </div>
      )}

      {orderLines.length > 0 && !orderText && (
        <button className="btn-primary" style={{ marginTop: '1.25rem' }} onClick={saveOrder} disabled={saving}>
          {saving ? <span className="spinner"></span> : 'Save & prepare to send'}
        </button>
      )}

      {orderText && (
        <div className="card" style={{ marginTop: '1.5rem' }}>
          <div className="section-label" style={{ marginBottom: 10 }}>✓ Order saved — send it:</div>
          <pre style={{ fontSize: 13, fontFamily: 'inherit', whiteSpace: 'pre-wrap', margin: '0 0 14px', wordBreak: 'break-word', background: 'var(--cream)', padding: 12, borderRadius: 8, color: 'var(--text-primary)' }}>{orderText}</pre>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <a href={`https://wa.me/?text=${encodeURIComponent(orderText)}`} target="_blank"
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: '#25D366', color: '#fff', padding: '13px', borderRadius: 'var(--radius)', fontWeight: 600, textDecoration: 'none', fontSize: 14, letterSpacing: '0.05em', textTransform: 'uppercase' }}>
              <i className="ti ti-brand-whatsapp" style={{ fontSize: 18 }}></i>Send via WhatsApp
            </a>
            <a href={`mailto:?subject=Order for ${supplier?.fields['Name']}&body=${encodeURIComponent(orderText)}`}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: '#fff', color: 'var(--petrol)', border: '1.5px solid var(--border-strong)', padding: '13px', borderRadius: 'var(--radius)', fontWeight: 600, textDecoration: 'none', fontSize: 14, letterSpacing: '0.05em', textTransform: 'uppercase' }}>
              <i className="ti ti-mail" style={{ fontSize: 17 }}></i>Send via Email
            </a>
            <button onClick={() => { navigator.clipboard?.writeText(orderText); setSent('copy'); }}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: '#fff', border: '1.5px solid var(--border-strong)', color: 'var(--petrol)' }}>
              <i className="ti ti-copy" style={{ fontSize: 16 }}></i>{sent === 'copy' ? 'Copied!' : 'Copy text'}
            </button>
          </div>
          <button className="btn-ghost" style={{ marginTop: 12, width: '100%' }} onClick={() => setOrderText('')}>
            + New order for another supplier

        </div>
      )}
    </div>
  );
}

function PendingOrdersScreen({ user, api }) {
  const [orders, setOrders] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [items, setItems] = useState([]);
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [edits, setEdits] = useState({});        // itemId -> quantity string
  const [newLines, setNewLines] = useState({});   // orderId -> [{productId, qty}]
  const [addingTo, setAddingTo] = useState(null); // orderId currently showing the "add item" picker
  const [savingOrder, setSavingOrder] = useState(null);

  useEffect(() => {
    async function load() {
      try {
        // CHANGED 2026-09-23: only orders not yet delivered (Delivered ones are
        // handled on the Invoice screen) and only their own items.
        const [{ orders: o, items: i }, s, p] = await Promise.all([
          loadOrdersWithItems(api, `AND({Status} != 'Closed', {Status} != 'Delivered')`), api.getAll('Suppliers'), api.getAll('Products'),
        ]);
        let scoped = o.filter(x => x.fields['Status'] !== 'Closed' && x.fields['Status'] !== 'Delivered');
        if (user.role === 'kitchen') scoped = scoped.filter(x => x.fields['Restaurant'] === user.restaurant);
        setOrders(scoped.sort((a,b) => (b.fields['Order Date'] || '').localeCompare(a.fields['Order Date'] || '')));
        setSuppliers(s); setItems(i); setProducts(p);
      } catch(e) { alert('Error: ' + e.message); }
      finally { setLoading(false); }
    }
    load();
  }, []);

  function addBlankLine(orderId) {
    setNewLines(nl => ({ ...nl, [orderId]: [...(nl[orderId] || []), { productId: '', qty: '' }] }));
    setAddingTo(orderId);
  }
  function updateNewLine(orderId, idx, field, value) {
    setNewLines(nl => {
      const arr = [...(nl[orderId] || [])];
      arr[idx] = { ...arr[idx], [field]: value };
      return { ...nl, [orderId]: arr };
    });
  }
  function removeNewLine(orderId, idx) {
    setNewLines(nl => {
      const arr = [...(nl[orderId] || [])];
      arr.splice(idx, 1);
      return { ...nl, [orderId]: arr };
    });
  }

  async function saveOrderChanges(orderId, oItems) {
    setSavingOrder(orderId);
    try {
      for (const it of oItems) {
        const val = edits[it.id];
        if (val !== undefined && val !== '' && Number(val) !== it.fields['Quantity']) {
          await api.update('Order Items', it.id, { 'Quantity': Number(val) });
        }
      }
      const toAdd = (newLines[orderId] || []).filter(l => l.productId && Number(l.qty) > 0);
      if (toAdd.length) {
        await api.createMany('Order Items', toAdd.map(l => ({
          'Order': [orderId], 'Product': [l.productId], 'Quantity': Number(l.qty), 'Received': false, 'Invoice Match': 'Pending Review'
        })));
      }
      const [refreshed] = await api.getByIds('Orders', [orderId]);
      const freshItems = await api.getByIds('Order Items', (refreshed && refreshed.fields['Order items']) || []);
      setItems(prev => [...prev.filter(it => !(it.fields['Order'] || []).includes(orderId)), ...freshItems]);
      setEdits(e => { const n = { ...e }; oItems.forEach(it => delete n[it.id]); return n; });
      setNewLines(nl => ({ ...nl, [orderId]: [] }));
      setAddingTo(null);
    } catch(e) { alert('Error: ' + e.message); }
    finally { setSavingOrder(null); }
  }

  if (loading) return <div className="content"><Loader /></div>;
  if (!orders.length) return <div className="content" style={{ textAlign: 'center', padding: '3rem', color: 'var(--text-muted)' }}>No open orders.</div>;

  return (
    <div className="content">
      {orders.map(o => {
        const sup = suppliers.find(s => s.id === (o.fields['Supplier'] || [])[0]);
        const oItems = items.filter(i => (i.fields['Order'] || []).includes(o.id));
        const rc = REST_COLORS[o.fields['Restaurant']] || { bg: '#eee', text: '#555' };
        const supplierProducts = products.filter(p => (p.fields['Supplier'] || []).includes(sup?.id));
        const hasChanges = oItems.some(it => edits[it.id] !== undefined && edits[it.id] !== '' && Number(edits[it.id]) !== it.fields['Quantity'])
          || (newLines[o.id] || []).some(l => l.productId && Number(l.qty) > 0);
        return (
          <div key={o.id} className="card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10, gap: 8 }}>
              <div>
                <div style={{ fontFamily: 'Fraunces, serif', fontWeight: 600, fontSize: 16, color: 'var(--petrol)' }}>{sup?.fields['Name'] || 'Unknown'}</div>
                <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>{o.fields['Order Date']} · {o.fields['Created By']}</div>
                <div style={{ marginTop: 6, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  <span className="badge" style={{ background: rc.bg, color: rc.text }}>{o.fields['Restaurant']}</span>
                  <Badge color={o.fields['Status'] === 'Pending' ? 'amber' : 'teal'}>{o.fields['Status']}</Badge>
                </div>
              </div>
            </div>
            <div style={{ fontSize: 13, color: 'var(--text-secondary)', borderTop: '1px solid var(--border)', paddingTop: 8 }}>
              {oItems.length === 0 && !(newLines[o.id] || []).length ? <span style={{ color: 'var(--text-muted)' }}>No items</span> :
                oItems.map((it, i) => {
                  const prod = products.find(p => (it.fields['Product'] || []).includes(p.id));
                  // CHANGED 2026-09-02: once an item has actually been received, show
                  // its real "Received Qty" here instead of the original "Quantity" —
                  // previously this always showed the as-ordered number forever, even
                  // after receiving corrected it (e.g. ordered 44, actually got 63),
                  // which looked like the order was permanently "stuck" on the wrong
                  // number and caused real confusion about whether the correction had
                  // taken effect. The stock ledger itself was always correct (it's
                  // written from Received Qty at receiving time) — this was a display-
                  // only bug. The original ordered quantity is now shown alongside as a
                  // small note when it differs, for reference.
                  const wasReceived = !!it.fields['Received'];
                  const receivedQtyVal = it.fields['Received Qty'];
                  const displayBase = (wasReceived && receivedQtyVal !== undefined && receivedQtyVal !== '') ? receivedQtyVal : it.fields['Quantity'];
                  const currentVal = edits[it.id] !== undefined ? edits[it.id] : displayBase;
                  const differsFromOrdered = wasReceived && receivedQtyVal !== undefined && receivedQtyVal !== '' && Number(receivedQtyVal) !== Number(it.fields['Quantity']);
                  return (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0' }}>
                      <input
                        type="text" inputMode="decimal"
                        value={currentVal}
                        onChange={e => setEdits(ed => ({ ...ed, [it.id]: e.target.value.replace(',', '.') }))}
                        style={{ width: 70, fontSize: 13, padding: '3px 6px', minHeight: 28 }}
                      />
                      <span>× {prod?.fields['Name'] || '...'}</span>
                      {differsFromOrdered && <span style={{ fontSize: 11, color: 'var(--text-warning)' }}>(ordered {it.fields['Quantity']})</span>}
                    </div>
                  );
                })}
              {(newLines[o.id] || []).map((line, idx) => (
                <div key={'new'+idx} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0' }}>
                  <input
                    type="text" inputMode="decimal" placeholder="qty"
                    value={line.qty}
                    onChange={e => updateNewLine(o.id, idx, 'qty', e.target.value.replace(',', '.'))}
                    style={{ width: 70, fontSize: 13, padding: '3px 6px', minHeight: 28 }}
                  />
                  <select
                    value={line.productId}
                    onChange={e => updateNewLine(o.id, idx, 'productId', e.target.value)}
                    style={{ flex: 1, fontSize: 13, padding: '3px 6px', minHeight: 28 }}
                  >
                    <option value="">Select product...</option>
                    {supplierProducts.map(p => <option key={p.id} value={p.id}>{p.fields['Name']}</option>)}
                  </select>
                  <button onClick={() => removeNewLine(o.id, idx)} style={{ padding: '2px 8px', minHeight: 28 }}>
                    <i className="ti ti-x" style={{ fontSize: 14 }}></i>
                  </button>
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
              <button className="btn-ghost" style={{ flex: 1, fontSize: 12, padding: '8px' }} onClick={() => addBlankLine(o.id)}>
                + Add item
              </button>
              {hasChanges && (
                <button className="btn-primary" style={{ flex: 1, fontSize: 12, padding: '8px' }}
                  onClick={() => saveOrderChanges(o.id, oItems)} disabled={savingOrder === o.id}>
                  {savingOrder === o.id ? <span className="spinner"></span> : 'Save changes'}
                </button>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function DeliveryScreen({ user, api }) {
  const [orders, setOrders] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [allItems, setAllItems] = useState([]);
  const [products, setProducts] = useState([]);
  const [selected, setSelected] = useState(null);
  const [checks, setChecks] = useState({});
  const [notes, setNotes] = useState({});
  const [receivedQty, setReceivedQty] = useState({});
  const [openNote, setOpenNote] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    async function load() {
      try {
        const [{ orders: o, items: i }, s, p] = await Promise.all([
          loadOrdersWithItems(api, `{Status} = 'Pending'`), api.getAll('Suppliers'), api.getAll('Products'),
        ]);
        let pending = o.filter(x => x.fields['Status'] === 'Pending');
        if (user.role === 'kitchen') pending = pending.filter(x => x.fields['Restaurant'] === user.restaurant);
        setOrders(pending); setSuppliers(s); setAllItems(i); setProducts(p);
        if (pending.length) setSelected(pending[0].id);
      } catch(e) { alert('Error: ' + e.message); }
      finally { setLoading(false); }
    }
    load();
  }, []);

  const order = orders.find(o => o.id === selected);
  const sup = order ? suppliers.find(s => s.id === (order.fields['Supplier'] || [])[0]) : null;
  const items = order ? allItems.filter(i => (i.fields['Order'] || []).includes(order.id)) : [];

  async function markDelivered() {
    setSaving(true);
    try {
      const today = new Date().toISOString().slice(0,10);
      const receivingLocationId = LOCATION_IDS[order.fields['Restaurant']];
      const isFromProductionKitchen = sup?.id === PRODUCTION_KITCHEN_SUPPLIER_ID;

      for (const item of items) {
        const qty = receivedQty[item.id] !== undefined && receivedQty[item.id] !== '' ? Number(receivedQty[item.id]) : Number(item.fields['Quantity']);
        await api.update('Order Items', item.id, { 'Received': !!checks[item.id], 'Delivery Note': notes[item.id] || '', 'Received Qty': qty });

        if (checks[item.id] && qty > 0) {
          const productId = (item.fields['Product'] || [])[0];
          if (productId && receivingLocationId) {
            await api.create('Inventory Transactions', {
              'Date': today,
              'Type': 'Delivery Received',
              'Quantity': qty,
              'Related Product': [productId],
              'Location': [receivingLocationId],
              'Transaction Added By': user.name,
              'Notes': `Received from ${sup?.fields['Name'] || 'supplier'} (Order ${order.id})`,
            });
          }
          // The Production Kitchen holds its own stock (Retail role) — shipping goods out
          // to a restaurant draws it down, just like a restaurant's own consumption would.
          if (productId && isFromProductionKitchen) {
            await api.create('Inventory Transactions', {
              'Date': today,
              'Type': 'Manual Adjustment',
              'Quantity': -qty,
              'Related Product': [productId],
              'Location': [LOCATION_IDS['Groenk Production Kitchen Fornalutx']],
              'Transaction Added By': user.name,
              'Notes': `Shipped to ${order.fields['Restaurant']} (Order ${order.id})`,
            });
          }
        }
      }
      await api.update('Orders', order.id, { 'Status': 'Delivered', 'Delivery Date': today });
      setOrders(o => o.filter(x => x.id !== order.id));
      setSelected(null); setChecks({}); setNotes({}); setReceivedQty({});
    } catch(e) { alert('Error: ' + e.message); }
    finally { setSaving(false); }
  }

  if (loading) return <div className="content"><Loader /></div>;
  if (!orders.length) return <div className="content" style={{ textAlign: 'center', padding: '3rem', color: 'var(--text-muted)' }}>No pending deliveries.</div>;

  const rc = order ? (REST_COLORS[order.fields['Restaurant']] || { bg: '#eee', text: '#555' }) : {};

  return (
    <div className="content">
      <div style={{ marginBottom: '1rem' }}>
        <div className="section-label">Select order</div>
        <select value={selected || ''} onChange={e => { setSelected(e.target.value); setChecks({}); setNotes({}); setReceivedQty({}); }}>
          {orders.map(o => {
            const s = suppliers.find(x => x.id === (o.fields['Supplier'] || [])[0]);
            return <option key={o.id} value={o.id}>{s?.fields['Name']} – {o.fields['Restaurant']} ({o.fields['Order Date']})</option>;
          })}
        </select>
      </div>
      {order && (
        <>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 14 }}>
            <span className="badge" style={{ background: rc.bg, color: rc.text }}>{order.fields['Restaurant']}</span>
            <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>by {order.fields['Created By']}</span>
          </div>
          <div>
            {items.map(item => {
              const prod = products.find(p => (item.fields['Product'] || []).includes(p.id));
              const ordered = Number(item.fields['Quantity']);
              const currentReceived = receivedQty[item.id] !== undefined ? receivedQty[item.id] : ordered;
              const differs = Number(currentReceived) !== ordered;
              return (
                <div key={item.id} className="card card-muted" style={{ marginBottom: 8 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                    <input type="checkbox" checked={!!checks[item.id]} onChange={() => setChecks(c => ({ ...c, [item.id]: !c[item.id] }))} style={{ width: 22, height: 22, minHeight: 22, padding: 0, accentColor: 'var(--petrol)' }} />
                    <div style={{ flex: 1 }} onClick={() => setChecks(c => ({ ...c, [item.id]: !c[item.id] }))}>
                      <div style={{ fontSize: 14, fontWeight: 600, color: checks[item.id] ? 'var(--text-muted)' : 'var(--petrol)', textDecoration: checks[item.id] ? 'line-through' : 'none' }}>
                        {prod?.fields['Name'] || '...'}
                      </div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Ordered: {ordered}</div>
                    </div>
                    {checks[item.id] && <i className="ti ti-check" style={{ color: 'var(--text-success)', fontSize: 20 }}></i>}
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 8 }}>
                    <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>Received qty:</span>
                    <input
                      type="text"
                      inputMode="decimal"
                      value={currentReceived}
                      onChange={e => setReceivedQty(q => ({ ...q, [item.id]: e.target.value.replace(',', '.') }))}
                      onClick={e => e.stopPropagation()}
                      style={{ width: 80, fontSize: 14, padding: '4px 8px', minHeight: 32, border: differs ? '1px solid var(--text-warning, #c77700)' : undefined }}
                    />
                    {differs && <span style={{ fontSize: 12, color: 'var(--text-warning, #c77700)' }}>⚠ differs from ordered</span>}
                  </div>
                  <button onClick={() => setOpenNote(openNote === item.id ? null : item.id)}
                    style={{ marginTop: 8, fontSize: 12, padding: '4px 8px', minHeight: 28, color: notes[item.id] ? 'var(--text-warning)' : 'var(--text-muted)', background: 'transparent', border: 'none', textTransform: 'none', letterSpacing: 0 }}>
                    {notes[item.id] ? `📝 ${notes[item.id]}` : '+ Add note'}
                  </button>
                  {openNote === item.id && (
                    <input type="text" placeholder="What's the issue?" value={notes[item.id] || ''} onChange={e => setNotes(n => ({ ...n, [item.id]: e.target.value }))} style={{ marginTop: 6, fontSize: 14 }} autoFocus />
                  )}
                </div>
              );
            })}
          </div>
          <button className="btn-primary" style={{ marginTop: '1.25rem' }} onClick={markDelivered} disabled={saving}>
            {saving ? <span className="spinner"></span> : 'Mark delivery complete'}
          </button>
        </>
      )}
    </div>
  );
}

function InvoiceScreen({ api }) {
  const [orders, setOrders] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [allItems, setAllItems] = useState([]);
  const [products, setProducts] = useState([]);
  const [selected, setSelected] = useState(null);
  const [matches, setMatches] = useState({});
  const [receivedQty, setReceivedQty] = useState({});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    async function load() {
      try {
        const [o, s, p] = await Promise.all([api.getAll('Orders', { filter: `{Status} = 'Delivered'` }), api.getAll('Suppliers'), api.getAll('Products')]);
        const delivered = o.filter(x => x.fields['Status'] === 'Delivered');
        setOrders(delivered); setSuppliers(s); setProducts(p);
        if (delivered.length) setSelected(delivered[0].id);
      } catch(e) { alert('Error: ' + e.message); }
      finally { setLoading(false); }
    }
    load();
  }, []);

  // ADDED 2026-09-23: fetch the items of the selected order on demand instead of
  // downloading every Order Item up front.
  useEffect(() => {
    const ord = orders.find(o => o.id === selected);
    if (!ord) return;
    const ids = ord.fields['Order items'] || [];
    if (ids.every(id => allItems.some(it => it.id === id))) return;
    let cancelled = false;
    api.getByIds('Order Items', ids).then(fetched => {
      if (!cancelled) setAllItems(prev => [...prev.filter(it => !ids.includes(it.id)), ...fetched]);
    }).catch(e => alert('Error: ' + e.message));
    return () => { cancelled = true; };
  }, [selected, orders]);

  const order = orders.find(o => o.id === selected);
  const sup = order ? suppliers.find(s => s.id === (order.fields['Supplier'] || [])[0]) : null;
  const items = order ? allItems.filter(i => (i.fields['Order'] || []).includes(order.id)) : [];
  const allReviewed = items.length > 0 && items.every(i => matches[i.id]);

  async function closeOrder() {
    setSaving(true);
    try {
      // CHANGED 2026-09-02: previously updated each Order Item one at a time in a
      // sequential loop, then updated the Order's own Status as a separate, final
      // request. With 15-18 items that's a long chain of individual network calls —
      // every item update can succeed while the single LAST call (the Order's Status
      // -> "Closed") hits a transient hiccup, leaving the order stuck on "Delivered"
      // with no clear indication of what actually failed (confirmed to have happened
      // for a real order on 2026-09-02: every item was correctly saved, but the order
      // itself never flipped to Closed, so it kept showing stale ordered-quantities in
      // Open Orders). Fixed by (1) running the item updates in parallel instead of one
      // by one, shrinking the failure window, and (2) retrying the Status update once,
      // since that single write is what actually makes the order disappear from Open
      // Orders / Pending Orders.
      await Promise.all(items.map(item => {
        const fields = { 'Invoice Match': matches[item.id] || 'Pending Review' };
        const rq = receivedQty[item.id];
        if (rq !== undefined && rq !== '') fields['Received Qty'] = Number(rq);
        return api.update('Order Items', item.id, fields);
      }));
      try {
        await api.update('Orders', order.id, { 'Status': 'Closed' });
      } catch (e) {
        await api.update('Orders', order.id, { 'Status': 'Closed' }); // one retry — this is the write that actually closes the order
      }
      setOrders(o => o.filter(x => x.id !== order.id));

          <div>
            {items.map(item => {
              const prod = products.find(p => (item.fields['Product'] || []).includes(p.id));
              const ordered = Number(item.fields['Quantity']);
              const currentReceived = receivedQty[item.id] !== undefined ? receivedQty[item.id] : (item.fields['Received Qty'] !== undefined ? item.fields['Received Qty'] : ordered);
              const differs = Number(currentReceived) !== ordered;
              return (

                  <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--petrol)', marginBottom: 4 }}>{prod?.fields['Name'] || '...'}</div>
                  <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 8 }}>Ordered: {ordered}</div>
                  {item.fields['Delivery Note'] && <div style={{ fontSize: 12, color: 'var(--text-warning)', marginBottom: 10 }}>📝 {item.fields['Delivery Note']}</div>}
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>

                    />

                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={() => setMatches(m => ({ ...m, [item.id]: 'Matches' }))}
                      style={{ flex: 1, padding: '10px', fontSize: 13, background: matches[item.id] === 'Matches' ? 'var(--bg-success)' : '#fff', color: matches[item.id] === 'Matches' ? 'var(--text-success)' : 'var(--text-secondary)', border: matches[item.id] === 'Matches' ? '1.5px solid var(--text-success)' : '1px solid var(--border-strong)', textTransform: 'none', letterSpacing: 0 }}>
                      ✓ Matches
                    </button>
                    <button onClick={() => setMatches(m => ({ ...m, [item.id]: 'Discrepancy' }))}
                      style={{ flex: 1, padding: '10px', fontSize: 13, background: matches[item.id] === 'Discrepancy' ? 'var(--bg-danger)' : '#fff', color: matches[item.id] === 'Discrepancy' ? 'var(--text-danger)' : 'var(--text-secondary)', border: matches[item.id] === 'Discrepancy' ? '1.5px solid var(--text-danger)' : '1px solid var(--border-strong)', textTransform: 'none', letterSpacing: 0 }}>
                      ✕ Discrepancy
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
          <button className={allReviewed ? 'btn-primary' : 'btn-disabled'} style={{ marginTop: '1.25rem' }} onClick={closeOrder} disabled={!allReviewed || saving}>
            {saving ? <span className="spinner"></span> : 'Close order'}
          </button>
        </>
      )}
    </div>
  );
}

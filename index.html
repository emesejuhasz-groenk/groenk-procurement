function InventoryScreen({ user, api }) {
  const [products, setProducts] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [txns, setTxns] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(null);
  const [counts, setCounts] = useState({});
  const [location, setLocation] = useState(user.restaurant);

  async function load() {
    setLoading(true);
    try {
      const locId = LOCATION_IDS[location];
      const [p, s, t] = await Promise.all([api.getAll('Products'), api.getAll('Suppliers'), loadStockTxns(api, locId ? [locId] : null)]);
      setProducts(p.filter(x => x.fields['Active'] !== false));
      setSuppliers(s);
      setTxns(t);
    } catch(e) { alert('Error: ' + e.message); }
    finally { setLoading(false); }
  }
  // CHANGED 2026-09-23: loads only the selected location's transactions, so
  // switching location reloads.
  useEffect(() => { load(); }, [location]);

  const locationId = LOCATION_IDS[location];
  function currentStock(productId, clamp = true) {
    return computeCurrentStock(txns, productId, locationId, clamp);
  }
  // ADDED 2026-09-18 (requested by Emese): surface how stale each product's
  // physical count is, right on the row, and default-sort so the most
  // overdue items float to the top — the Cruz de Alba/Obalo incidents both
  // came from a count that quietly went 9-14 days without anyone noticing it
  // was overdue. Returns { days: number|null, label: string } — days is null
  // for a product that has never been counted at all (shown as most urgent).
  function lastCountDaysAgo(productId) {
    const relevant = txns.filter(t => (t.fields['Related Product'] || []).includes(productId) && (t.fields['Location'] || []).includes(locationId));
    let lastCount = null;
    for (const t of relevant) {
      if (IS_MANUAL_COUNT(t) && (!lastCount || t.createdTime > lastCount.createdTime)) lastCount = t;
    }
    // CHANGED 2026-09-23 (Emese): the Monday 2026-09-21 full count is the stock
    // baseline. Anything with no physical count since then has no trustworthy
    // stock figure, so it is flagged loudly (red, sorted to the top).
    if (!lastCount || (lastCount.createdTime || '').slice(0, 10) < BASELINE_INVENTORY_DATE) return { days: null, label: 'NO INVENTORY' };
    const days = Math.floor((Date.now() - new Date(lastCount.createdTime).getTime()) / 86400000);
    return { days, label: days === 0 ? 'Updated today' : days === 1 ? 'Updated 1 day ago' : `Updated ${days} days ago` };
  }

  async function saveCount(productId) {
    const val = counts[productId];
    if (val === undefined || val === '') return;
    const override = INVENTORY_COUNT_OVERRIDE[productId];
    const enteredCount = Number(val);
    const newCount = override ? enteredCount / override.countsPerStockUnit : enteredCount;
    const delta = newCount - currentStock(productId, /* clamp */ false);
    if (delta === 0) { setCounts(c => { const n = { ...c }; delete n[productId]; return n; }); return; }
    setSaving(productId);
    try {
      // CHANGED 2026-09-18 (real slowness reported by Emese): this used to
      // re-fetch the ENTIRE Inventory Transactions table after every single
      // save (api.getAll — paginated, dozens of round-trips once the table grew
      // to months of history) just to show one new row. api.create already
      // returns the full created record (id, createdTime, fields) — appending
      // it to the existing txns state locally gives the same correct result
      // instantly, with zero extra network calls. Every screen's own
      // computeCurrentStock/currentStock already recomputes from whatever's in
      // txns, so this is exactly as correct as a full reload, just immediate.
      const created = await api.create('Inventory Transactions', {
        'Date': new Date().toISOString().slice(0,10),
        'Type': 'Manual Adjustment',
        'Quantity': delta,
        'Related Product': [productId],
        'Location': [locationId],
        'Transaction Added By': user.name,
        'Notes': override ? `Manual count (${enteredCount} ${override.countUnit})` : 'Manual count',
      });
      setTxns(t => [...t, created]);
      setCounts(c => { const n = { ...c }; delete n[productId]; return n; });
    } catch(e) { alert('Error: ' + e.message); }
    finally { setSaving(null); }
  }

  if (loading) return <div className="content"><Loader /></div>;
  return (
    <div className="content">
      {user.role === 'admin' && (
        <div style={{ marginBottom: '1.25rem' }}>
          <div className="section-label">Location</div>
          <select value={location} onChange={e => setLocation(e.target.value)}>
            {RESTAURANTS.map(r => <option key={r} value={r}>{r}</option>)}
          </select>
        </div>
      )}
      {suppliers.map(s => {
        const ps = products.filter(p => (p.fields['Supplier'] || []).includes(s.id));
        if (!ps.length) return null;
        const hasCategories = ps.some(p => p.fields['Order Category']);
        // CHANGED 2026-09-18: default sort is now by staleness (most overdue —
        // or never counted at all — first), not alphabetical, so the most
        // urgent items are what you see first when the screen opens.
        const byStaleness = (a, b) => {
          const da = lastCountDaysAgo(a.id).days;
          const db = lastCountDaysAgo(b.id).days;
          if (da === null && db === null) return (a.fields['Name'] || '').trim().localeCompare((b.fields['Name'] || '').trim());
          if (da === null) return -1;
          if (db === null) return 1;
          return db - da;
        };
        const groups = hasCategories
          ? CATEGORY_ORDER.map(cat => ({ cat, items: ps.filter(p => (p.fields['Order Category'] || 'Other') === cat).sort(byStaleness) })).filter(g => g.items.length)
          : [{ cat: null, items: [...ps].sort(byStaleness) }];
        return (
          <div key={s.id} style={{ marginBottom: 20 }}>
            <div className="section-label" style={{ marginBottom: 6 }}>{s.fields['Name']}</div>
            {groups.map(g => (
              <div key={g.cat || 'all'}>
                {g.cat && (
                  <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', margin: '10px 0 4px' }}>
                    {g.cat}
                  </div>
                )}
                {g.items.map(p => {
                  const stock = currentStock(p.id);
                  const editing = counts[p.id] !== undefined;
                  const override = INVENTORY_COUNT_OVERRIDE[p.id];
                  const displayUnit = override ? override.countUnit : p.fields['Unit'];
                  const displayStock = Math.round((override ? stock * override.countsPerStockUnit : stock) * 100) / 100;
                  const { days: staleDays, label: staleLabel } = lastCountDaysAgo(p.id);
                  const staleColor = staleDays === null || staleDays >= 7 ? 'var(--danger, #c0392b)' : staleDays >= 3 ? 'var(--warning, #b8860b)' : 'var(--text-muted)';
                  return (
                    <div key={p.id} className="product-row">
                      <div>
                        <div className="product-name">{p.fields['Name']}</div>
                        <div className="product-unit">{displayUnit} · in stock: {displayStock}</div>
                        <div className="product-unit" style={{ color: staleColor, fontWeight: staleDays === null || staleDays >= 7 ? 700 : 400 }}>{staleLabel}</div>
                      </div>
                      <div className="qty-controls">
                        {editing ? (
                          <>
                            <input type="text" inputMode="decimal" placeholder="count" value={counts[p.id]}
                              onChange={e => setCounts(c => ({ ...c, [p.id]: e.target.value.replace(',', '.') }))}
                              className="qty-input" style={{ width: 64 }} />
                            <button className="qty-btn" onClick={() => saveCount(p.id)} disabled={saving === p.id}>
                              {saving === p.id ? <span className="spinner" style={{ width: 12, height: 12 }}></span> : <i className="ti ti-check" style={{ fontSize: 14 }}></i>}
                            </button>
                          </>
                        ) : (
                          <button style={{ fontSize: 11, padding: '6px 10px', minHeight: 30 }} onClick={() => setCounts(c => ({ ...c, [p.id]: String(displayStock) }))}>
                            Update count
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

function WasteScreen({ user, api }) {
  const [products, setProducts] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [menuItems, setMenuItems] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [wasteMode, setWasteMode] = useState('product'); // 'product' | 'dish'
  const [productId, setProductId] = useState('');
  const [dishId, setDishId] = useState('');
  const [qty, setQty] = useState('');
  const [reason, setReason] = useState(WASTE_REASONS[0]);
  const [notes, setNotes] = useState('');
  const [saving, setSaving] = useState(false);
  const [recent, setRecent] = useState([]);

  async function load() {
    try {
      const [p, s, t, mi, bom] = await Promise.all([
        api.getAll('Products'), api.getAll('Suppliers'),
        api.getAll('Inventory Transactions', {
          filter: andFormula(`{Type} = 'Waste'`, LOCATION_FORMULA(LOCATION_IDS[user.restaurant])),
          sort: [{ field: 'Date', direction: 'desc' }], max: 8,
        }),
        api.getAll('Menu Items'), api.getAll('Recipes (BOM)'),
      ]);
      const active = p.filter(x => x.fields['Active'] !== false);
      setProducts(active);
      setSuppliers(s);
      setMenuItems(mi);
      setRecipes(bom);
      if (active.length) setProductId(active[0].id);
      const locationId = LOCATION_IDS[user.restaurant];
      setRecent(t.filter(x => x.fields['Type'] === 'Waste' && (x.fields['Location'] || []).includes(locationId))
        .sort((a,b) => (b.fields['Date'] || '').localeCompare(a.fields['Date'] || '')).slice(0, 8));
    } catch(e) { alert('Error: ' + e.message); }
    finally { setLoading(false); }
  }
  useEffect(() => { load(); }, []);

  // ---------- Restaurant Dishes: waste a whole finished dish ----------
  // ADDED 2026-09-14 (requested by Emese): staff often need to log an entire
  // finished dish as waste (a burger given away as staff food, a plate that came
  // back, a pizza that burned) — not the raw ingredients. Rather than making them
  // work out and log each ingredient separately, this mode reuses the same
  // Recipes (BOM) that already drives the daily sales deduction: pick a dish,
  // enter how many, and it writes one Waste transaction per underlying product,
  // in the product's own stocking unit, via the same convertQty() every other
  // screen already uses. No new Airtable table needed — this is built entirely
  // from Menu Items + Recipes (BOM), which already exist.
  const productUnitById = React.useMemo(() => Object.fromEntries(products.map(p => [p.id, p.fields['Unit'] || 'unit'])), [products]);
  const productPackSizeById = React.useMemo(() => Object.fromEntries(products.map(p => [p.id, p.fields['Pack Size']])), [products]);
  const productWeightPerUnitById = React.useMemo(() => Object.fromEntries(products.map(p => [p.id, p.fields['Weight per Unit (g)']])), [products]);
  const bomByMenuItem = React.useMemo(() => {
    const map = {};
    for (const r of recipes) {
      const compIds = r.fields['Component (Product)'] || [];
      const qtyPerUnit = Number(r.fields['Quantity per unit']) || 0;
      const bomUnit = r.fields['Unit'] || 'unit';
      for (const miId of (r.fields['Menu Item'] || [])) {
        for (const productId of compIds) (map[miId] = map[miId] || []).push({ productId, qtyPerUnit, bomUnit });
      }
    }
    return map;
  }, [recipes]);
  // Only dishes that actually have a recipe pointing to a real, active product —
  // otherwise there'd be nothing to deduct.
  const activeProductIds = React.useMemo(() => new Set(products.map(p => p.id)), [products]);
  const dishOptions = React.useMemo(() => {
    return menuItems
      .filter(m => (bomByMenuItem[m.id] || []).some(c => activeProductIds.has(c.productId)))
      .map(m => ({ id: m.id, name: m.fields['Name'] || '' }))
      .sort((a, b) => a.name.localeCompare(b.name, 'hu'));
  }, [menuItems, bomByMenuItem, activeProductIds]);
  const menuItemNameById = React.useMemo(() => Object.fromEntries(menuItems.map(m => [m.id, m.fields['Name'] || ''])), [menuItems]);

  async function submitDishWaste() {
    if (!dishId || !qty || Number(qty) <= 0) return;
    setSaving(true);
    try {
      const dishCount = Number(qty);
      const bom = (bomByMenuItem[dishId] || []).filter(c => activeProductIds.has(c.productId));
      const skipped = [];
      const writes = [];
      for (const { productId: pid, qtyPerUnit, bomUnit } of bom) {
        const converted = convertQty(qtyPerUnit, bomUnit, productUnitById[pid], pid, productPackSizeById[pid], productWeightPerUnitById[pid]);
        if (converted === null) { skipped.push(pid); continue; }
        writes.push({
          'Date': new Date().toISOString().slice(0,10),
          'Type': 'Waste',
          'Quantity': dishCount * converted,
          'Related Product': [pid],
          'Location': [LOCATION_IDS[user.restaurant]],
          'Waste Reason': reason,
          'Notes': `${dishCount}x ${menuItemNameById[dishId]} (${reason})${notes ? ' — ' + notes : ''}`.trim(),
          'Transaction Added By': user.name,
        });
      }
      await Promise.all(writes.map(fields => api.create('Inventory Transactions', fields)));
      if (skipped.length) {
        alert(`Mentve, de ${skipped.length} alapanyagot nem sikerült átváltani (hiányzó mértékegység-adat) — ezeket kézzel is rögzítheted a "Nyers alapanyag" módban.`);
      }
      setQty(''); setNotes(''); setReason(WASTE_REASONS[0]);
      await load();
    } catch(e) { alert('Error: ' + e.message); }
    finally { setSaving(false); }
  }

  async function submitWaste() {
    if (!productId || !qty || Number(qty) <= 0) return;
    setSaving(true);
    try {
      // CHANGED 2026-09-03: previously this always wrote the typed number straight
      // into the ledger as-is, in the product's own STOCKING unit — fine for most
      // products, but wrong for anything on the INVENTORY_COUNT_OVERRIDE list
      // (Cheesecake/Carrot Cake counted in slices, bottled wines/spirits counted in
      // bottles, while the product itself is stocked as a whole cake or a box/caja).
      // Staff naturally think and type in the unit they can see and count (1 slice,
      // 1 bottle), and until now that got written as 1 WHOLE stock unit instead — an
      // 8x overstatement for a cake slice, or a 6-24x overstatement for a single
      // broken bottle. Found via a real cheesecake-slice waste entry on 2026-09-03.
      // Now converts the same way InventoryScreen's saveCount already does.
      const override = INVENTORY_COUNT_OVERRIDE[productId];
      const enteredQty = Number(qty);
      const stockQty = override ? enteredQty / override.countsPerStockUnit : enteredQty;
      await api.create('Inventory Transactions', {
        'Date': new Date().toISOString().slice(0,10),
        'Type': 'Waste',
        'Quantity': stockQty,
        'Related Product': [productId],
        'Location': [LOCATION_IDS[user.restaurant]],
        'Waste Reason': reason,
        'Notes': override ? `${notes ? notes + ' — ' : ''}${enteredQty} ${override.countUnit}`.trim() : notes,
        'Transaction Added By': user.name,
      });
      setQty(''); setNotes(''); setReason(WASTE_REASONS[0]);
      await load();
    } catch(e) { alert('Error: ' + e.message); }
    finally { setSaving(false); }
  }

  if (loading) return <div className="content"><Loader /></div>;
  return (
    <div className="content">
      <div className="card">
        <div className="section-label">Mode</div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
          <button
            style={{ flex: 1, background: wasteMode === 'product' ? 'var(--petrol)' : '#fff', color: wasteMode === 'product' ? '#fff' : 'var(--petrol)', borderColor: 'var(--border-strong)' }}
            onClick={() => setWasteMode('product')}>
            Nyers alapanyag
          </button>
          <button
            style={{ flex: 1, background: wasteMode === 'dish' ? 'var(--petrol)' : '#fff', color: wasteMode === 'dish' ? '#fff' : 'var(--petrol)', borderColor: 'var(--border-strong)' }}
            onClick={() => setWasteMode('dish')}>
            Étteremi fogás
          </button>
        </div>

        {wasteMode === 'dish' ? (
          <>
            <div className="section-label">Dish</div>
            <select value={dishId} onChange={e => setDishId(e.target.value)} style={{ marginBottom: 12 }}>
              <option value="">Select a dish...</option>
              {dishOptions.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
            <div className="section-label">How many portions</div>
            <input type="text" inputMode="decimal" placeholder="0" value={qty} onChange={e => setQty(e.target.value.replace(',', '.'))} style={{ marginBottom: 12 }} />
            <div className="section-label">Reason</div>
            <select value={reason} onChange={e => setReason(e.target.value)} style={{ marginBottom: 12 }}>
              {WASTE_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
            <div className="section-label">Details (optional)</div>
            <input type="text" placeholder="e.g. sent back, order mistake" value={notes} onChange={e => setNotes(e.target.value)} style={{ marginBottom: 14 }} />
            <button className="btn-primary" onClick={submitDishWaste} disabled={!dishId || !qty || saving}>
              {saving ? <span className="spinner"></span> : 'Log dish waste'}
            </button>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 10, textAlign: 'center' }}>
              A recept alapján automatikusan levonja az összes hozzávalót a készletből — nem kell egyenként megadnod.
            </div>
          </>
        ) : (
          <>
            <div className="section-label">Product</div>
            <select value={productId} onChange={e => setProductId(e.target.value)} style={{ marginBottom: 12 }}>
              {suppliers.map(s => {
                const ps = products.filter(p => (p.fields['Supplier'] || []).includes(s.id));
                if (!ps.length) return null;
                return (
                  <optgroup key={s.id} label={s.fields['Name']}>
                    {ps.map(p => <option key={p.id} value={p.id}>{p.fields['Name']} ({INVENTORY_COUNT_OVERRIDE[p.id] ? INVENTORY_COUNT_OVERRIDE[p.id].countUnit : p.fields['Unit']})</option>)}
                  </optgroup>
                );
              })}
            </select>
            <div className="section-label">Quantity wasted{INVENTORY_COUNT_OVERRIDE[productId] ? ` (in ${INVENTORY_COUNT_OVERRIDE[productId].countUnit})` : ''}</div>
            <input type="text" inputMode="decimal" placeholder="0" value={qty} onChange={e => setQty(e.target.value.replace(',', '.'))} style={{ marginBottom: 12 }} />
            <div className="section-label">Reason</div>
            <select value={reason} onChange={e => setReason(e.target.value)} style={{ marginBottom: 12 }}>
              {WASTE_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
            <div className="section-label">Details (optional)</div>
            <input type="text" placeholder="e.g. fish went off, delivery too early" value={notes} onChange={e => setNotes(e.target.value)} style={{ marginBottom: 14 }} />
            <button className="btn-primary" onClick={submitWaste} disabled={!productId || !qty || saving}>
              {saving ? <span className="spinner"></span> : 'Log waste'}
            </button>
          </>
        )}
      </div>

      {recent.length > 0 && (
        <div style={{ marginTop: '1.5rem' }}>
          <div className="section-label" style={{ marginBottom: 8 }}>Recent waste at {user.restaurant}</div>
          {recent.map(t => {
            const prod = products.find(p => (t.fields['Related Product'] || []).includes(p.id));
            const productId = (t.fields['Related Product'] || [])[0];
            const override = INVENTORY_COUNT_OVERRIDE[productId];
            const displayQty = override ? Math.round(Number(t.fields['Quantity']) * override.countsPerStockUnit * 100) / 100 : t.fields['Quantity'];
            const displayUnit = override ? override.countUnit : '';
            return (
              <div key={t.id} className="card card-muted" style={{ padding: '10px 14px', marginBottom: 6 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--petrol)' }}>{displayQty}{displayUnit ? ` ${displayUnit}` : ''} × {prod?.fields['Name'] || '...'}</div>
                <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{t.fields['Date']} · {t.fields['Waste Reason']}{t.fields['Notes'] ? ` · ${t.fields['Notes']}` : ''}</div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---------- Production Kitchen: Today's Prep ----------
// Added 2026-08-31, replacing the emailed daily order for the Production Kitchen.
// Why: the GitHub Actions cron trigger for the automated order proved unreliable on
// this account (confirmed via two separate incidents — registration lag after a cron
// change, then repeated 6+ hour delays even once "working") — no amount of workflow
// tuning fixed it, because GitHub gives no timing guarantee for `schedule` triggers.
// This screen removes that dependency entirely for the ORDER step: it computes the
// same suggestion formula LIVE, client-side, the moment a Production Kitchen staff
// member opens the tab — nothing waits on a cron firing at the right minute.
// The Daily Stock Consumption Deduction job still needs to run each morning (this
// screen's "current stock" numbers depend on it), so that dependency remains — but
// it's now the only one left, down from three (Deduction + PK order script + email).
//
// UPDATED 2026-09-02: products are now grouped by "Order Category" (Meat & Fish,
// Sauce, Bakery/pastry/dessert, Extra topping, Drink, Other) — same CATEGORY_ORDER
// and grouping logic already used in InventoryScreen — instead of one flat
// alphabetical list. Requested by Emese so restaurant staff can scan the prep list
// the same way they already scan Inventory, rather than hunting for items in a
// single long A-Z list.
const RESTAURANT_ORDER = ['Deia - Groenk Bistro', 'Fornalutx - Groenk Bistro', 'Soller - Groenk Pizza'];

// ---------- Delivery schedule: back to permanent T+0, every day ----------
// CHANGED 2026-09-13 (confirmed with Emese): reverted the T+1 / Monday-skip
// experiment. Production Kitchen delivers every day again, and this screen is
// back to preparing T+0 (today's prep is for today's own delivery) every
// single day, including Monday. Must match production-kitchen-order.js.
function computeTarget(today) {
  return { targetDate: today, daysToCover: 1 };
}

function PrepScreen({ user, api }) {
  const [loading, setLoading] = useState(true);
  const [products, setProducts] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [dailySales, setDailySales] = useState([]);
  const [invTxns, setInvTxns] = useState([]);
  const [existingOrders, setExistingOrders] = useState([]);
  const [existingOrderItems, setExistingOrderItems] = useState([]);
  const [activeRestaurant, setActiveRestaurant] = useState(RESTAURANT_ORDER[0]);
  const [editedQtys, setEditedQtys] = useState({}); // `${restaurant}|${productId}` -> string
  const [checkedOff, setCheckedOff] = useState({}); // `${restaurant}|${productId}` -> bool (local prep checklist only, not written to Airtable)
  const [saving, setSaving] = useState(false);
  const [justSent, setJustSent] = useState({}); // restaurant -> true, resets on reload

  async function loadAll() {
    setLoading(true);
    // CHANGED 2026-09-23: 16 days of sales, only the 3 restaurants' stock rows,
    // and only recent orders with their own items.
    const restaurantLocIds = ['Soller - Groenk Pizza', 'Deia - Groenk Bistro', 'Fornalutx - Groenk Bistro'].map(n => LOCATION_IDS[n]);
    const [p, r, ds, it, ordData] = await Promise.all([
      api.getAll('Products'), api.getAll('Recipes (BOM)'), loadRecentSales(api, null),
      loadStockTxns(api, restaurantLocIds), loadOrdersWithItems(api, `IS_AFTER({Order Date}, DATEADD(TODAY(), -4, 'days'))`),
    ]);
    const ords = ordData.orders, ordItems = ordData.items;
    setProducts(p); setRecipes(r); setDailySales(ds); setInvTxns(it);
    setExistingOrders(ords); setExistingOrderItems(ordItems);
    setLoading(false);
  }
  useEffect(() => { loadAll(); }, []);

  const productById = React.useMemo(() => Object.fromEntries(products.map(p => [p.id, p.fields])), [products]);

  // suggestions[restaurantName] = { productId: qty } — mirrors production-kitchen-order.js
  // exactly (yesterday's single most recent day of sales × 1.5, minus current stock).
  const suggestions = React.useMemo(() => {
    if (loading) return {};
    const pkProductIds = new Set(products.filter(p => (p.fields['Supplier'] || []).includes(PRODUCTION_KITCHEN_SUPPLIER_ID)).map(p => p.id));
    const productUnitById = Object.fromEntries(products.map(p => [p.id, p.fields['Unit'] || 'unit']));
    const productPackSizeById = Object.fromEntries(products.map(p => [p.id, p.fields['Pack Size']]));
    const productWeightPerUnitById = Object.fromEntries(products.map(p => [p.id, p.fields['Weight per Unit (g)']]));

    const bomByMenuItem = {};
    for (const r of recipes) {
      const compIds = (r.fields['Component (Product)'] || []).filter(id => pkProductIds.has(id));
      if (!compIds.length) continue;
      const qtyPerUnit = Number(r.fields['Quantity per unit']) || 0;
      const bomUnit = r.fields['Unit'] || 'unit';
      for (const miId of (r.fields['Menu Item'] || [])) {
        for (const productId of compIds) (bomByMenuItem[miId] = bomByMenuItem[miId] || []).push({ productId, qtyPerUnit, bomUnit });
      }
    }

    const out = {};
    const { daysToCover } = computeTarget(new Date());
    for (const restaurantName of RESTAURANT_ORDER) {
      const locationId = LOCATION_IDS[restaurantName];
      const salesHere = dailySales.filter(s => (s.fields['Location'] || []).includes(locationId));
      const recentDates = [...new Set(salesHere.map(s => s.fields['Date']).filter(Boolean))].sort().reverse().slice(0, 1);
      const recentSales = salesHere.filter(s => recentDates.includes(s.fields['Date']));
      const salesByMenuItem = {};
      for (const s of recentSales) {
        const units = Number(s.fields['Units sold']) || 0;
        for (const miId of (s.fields['Menu Item'] || [])) (salesByMenuItem[miId] = salesByMenuItem[miId] || []).push(units);
      }
      const avgUnitsSold = {};
      for (const [miId, arr] of Object.entries(salesByMenuItem)) avgUnitsSold[miId] = arr.reduce((a, b) => a + b, 0);

      const avgConsumption = {};
      for (const [miId, avgUnits] of Object.entries(avgUnitsSold)) {
        const bom = bomByMenuItem[miId];
        if (!bom) continue;
        for (const { productId, qtyPerUnit, bomUnit } of bom) {
          const converted = convertQty(qtyPerUnit, bomUnit, productUnitById[productId], productId, productPackSizeById[productId], productWeightPerUnitById[productId]);
          if (converted === null) continue;
          avgConsumption[productId] = (avgConsumption[productId] || 0) + avgUnits * converted;
        }
      }
      const restaurantResult = {};
      for (const [productId, avg] of Object.entries(avgConsumption)) {
        const par = avg * daysToCover * ORDER_SUGGESTION_BUFFER;
        const stock = computeCurrentStock(invTxns, productId, locationId);
        const qty = Math.max(0, Math.ceil(par - stock));
        if (qty > 0) restaurantResult[productId] = qty;
      }
      out[restaurantName] = restaurantResult;
    }
    return out;
  }, [loading, products, recipes, dailySales, invTxns]);

  const today = new Date().toISOString().slice(0, 10);
  const targetDateStr = today;
  function existingOrderFor(restaurantName) {
    if (!targetDateStr) return null;
    return existingOrders.find(o => (o.fields['Supplier'] || []).includes(PRODUCTION_KITCHEN_SUPPLIER_ID) && o.fields['Restaurant'] === restaurantName && (o.fields['Order Date'] || '').slice(0, 10) === targetDateStr);
  }
  function existingItemFor(restaurantName, productId) {
    const order = existingOrderFor(restaurantName);
    if (!order) return null;
    return existingOrderItems.find(oi => (oi.fields['Order'] || []).includes(order.id) && (oi.fields['Product'] || [])[0] === productId) || null;
  }
  function qtyFor(restaurantName, productId) {
    const key = `${restaurantName}|${productId}`;
    if (editedQtys[key] !== undefined) return editedQtys[key];
    const existingItem = existingItemFor(restaurantName, productId);
    if (existingItem) return String(existingItem.fields['Quantity']);
    return String(suggestions[restaurantName]?.[productId] ?? 0);
  }

  async function confirmAndSend(restaurantName) {
    setSaving(true);
    try {
      const productIds = new Set([
        ...Object.keys(suggestions[restaurantName] || {}),
        ...existingOrderItems.filter(oi => existingOrderFor(restaurantName) && (oi.fields['Order'] || []).includes(existingOrderFor(restaurantName).id)).map(oi => (oi.fields['Product'] || [])[0]),
      ]);
      const items = [...productIds].map(productId => [productId, Number(qtyFor(restaurantName, productId)) || 0]).filter(([, qty]) => qty > 0);

      let order = existingOrderFor(restaurantName);
      if (!order) {
        order = await api.create('Orders', { 'Order Date': targetDateStr, 'Supplier': [PRODUCTION_KITCHEN_SUPPLIER_ID], 'Restaurant': restaurantName, 'Status': 'Ordered', 'Created By': user.name });
      } else {
        await api.update('Orders', order.id, { 'Status': 'Ordered' });
      }
      const currentItems = existingOrderItems.filter(oi => (oi.fields['Order'] || []).includes(order.id));
      const currentByProduct = Object.fromEntries(currentItems.map(oi => [(oi.fields['Product'] || [])[0], oi]));
      for (const [productId, qty] of items) {
        if (currentByProduct[productId]) {
          if (currentByProduct[productId].fields['Quantity'] !== qty) await api.update('Order Items', currentByProduct[productId].id, { 'Quantity': qty });
        } else {
          await api.createMany('Order Items', [{ 'Order': [order.id], 'Product': [productId], 'Quantity': qty, 'Received': false, 'Invoice Match': 'Pending Review' }]);
        }
      }
      setJustSent(s => ({ ...s, [restaurantName]: true }));
      await loadAll();
    } catch (e) { alert('Error: ' + e.message); }
    finally { setSaving(false); }
  }

  if (loading) return <div className="content"><Loader /></div>;

  const productIdsForRestaurant = [...new Set([
    ...Object.keys(suggestions[activeRestaurant] || {}),
    ...(existingOrderFor(activeRestaurant) ? existingOrderItems.filter(oi => (oi.fields['Order'] || []).includes(existingOrderFor(activeRestaurant).id)).map(oi => (oi.fields['Product'] || [])[0]) : []),
  ])].filter(Boolean);

  // Group the same way InventoryScreen does: by each Product's "Order Category"
  // field, in CATEGORY_ORDER, falling back to a single flat A-Z list if none of
  // today's products have a category set at all.
  const restaurantProducts = productIdsForRestaurant.map(id => ({ id, fields: productById[id] || {} }));
  const hasCategories = restaurantProducts.some(p => p.fields['Order Category']);
  const byName = (a, b) => (a.fields['Name'] || '').trim().localeCompare((b.fields['Name'] || '').trim());
  const groupedProducts = hasCategories
    ? CATEGORY_ORDER.map(cat => ({ cat, items: restaurantProducts.filter(p => (p.fields['Order Category'] || 'Other') === cat).sort(byName) })).filter(g => g.items.length)
    : [{ cat: null, items: [...restaurantProducts].sort(byName) }];

  const alreadySentToday = !!existingOrderFor(activeRestaurant) && existingOrderFor(activeRestaurant).fields['Status'] !== 'Pending';

  return (
    <div className="content">
      <div style={{ marginBottom: '1.25rem' }}>
        <div className="section-label">Today's prep — {today}</div>
        <div className="nav-scroll" style={{ marginTop: 8 }}>
          {RESTAURANT_ORDER.map(r => (
            <button key={r} className={`nav-btn ${activeRestaurant === r ? 'active' : ''}`}
              style={activeRestaurant !== r ? { background: 'var(--cream)', color: 'var(--petrol)', borderColor: 'var(--border-strong)' } : {}}
              onClick={() => setActiveRestaurant(r)}>
              {r.split(' - ')[0]}
              {Object.keys(suggestions[r] || {}).length > 0 && <span style={{ marginLeft: 6, opacity: 0.7 }}>({Object.keys(suggestions[r]).length})</span>}
            </button>
          ))}
        </div>
      </div>

      {productIdsForRestaurant.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)', fontSize: 14 }}>
          Nothing needed for {activeRestaurant.split(' - ')[0]} right now.
        </div>
      ) : (
        <div>
          {groupedProducts.map(g => (
            <div key={g.cat || 'all'}>
              {g.cat && (
                <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', margin: '10px 0 4px' }}>
                  {g.cat}
                </div>
              )}
              {g.items.map(({ id: productId, fields: p }) => {
                const key = `${activeRestaurant}|${productId}`;
                const suggested = suggestions[activeRestaurant]?.[productId];
                const isChecked = !!checkedOff[key];
                return (
                  <div key={productId} className="product-row" style={isChecked ? { opacity: 0.5 } : {}}>
                    <button className="qty-btn" style={{ background: isChecked ? 'var(--petrol)' : '#fff', borderColor: 'var(--border-strong)', flexShrink: 0 }}
                      onClick={() => setCheckedOff(c => ({ ...c, [key]: !c[key] }))}>
                      {isChecked && <i className="ti ti-check" style={{ fontSize: 16, color: '#fff' }}></i>}
                    </button>
                    <div style={{ flex: 1 }}>
                      <div className="product-name">{p['Name']}</div>
                      <div className="product-unit">
                        {p['Unit']}
                        {suggested !== undefined && <span style={{ marginLeft: 6, color: 'var(--petrol)', fontWeight: 700 }}>· suggested {suggested}</span>}
                      </div>
                    </div>
                    <div className="qty-controls">
                      <input type="text" inputMode="numeric" placeholder="0" value={qtyFor(activeRestaurant, productId)}
                        onChange={e => setEditedQtys(q => ({ ...q, [key]: e.target.value.replace(',', '.') }))}
                        className="qty-input" style={{ width: 56 }} />
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}

      <button className="btn-primary" style={{ marginTop: '1.25rem' }} onClick={() => confirmAndSend(activeRestaurant)} disabled={saving || productIdsForRestaurant.length === 0}>
        {saving ? <span className="spinner"></span> : (alreadySentToday ? 'Update sent order' : 'Confirm & mark as sent')}
      </button>
      {justSent[activeRestaurant] && (
        <div style={{ textAlign: 'center', marginTop: 10, fontSize: 13, color: 'var(--text-success)', fontWeight: 600 }}>
          ✓ Saved — {activeRestaurant.split(' - ')[0]} will see this in Open Orders / Receive Goods.
        </div>
      )}
      <div className="btn-ghost" style={{ marginTop: 14, textAlign: 'center', fontSize: 11 }}>
        The check mark is just a prep checklist for you on this device — it isn't saved. "Confirm & mark as sent" is what the restaurant actually sees.
      </div>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => localStorage.getItem('groenk_token') || '');
  const [user, setUser] = useState(null);
  const [tab, setTab] = useState('new');
  const api = token ? airtable(token) : null;
  const staffApi = token ? airtable(token, STAFF_BASE_ID) : null;

  const tabs = [
    { id: 'prep', label: "Today's prep", icon: 'ti-list-check', roles: ['kitchen', 'admin', 'manager'], restaurants: ['Groenk Production Kitchen Fornalutx'] },
    { id: 'new', label: 'New order', icon: 'ti-plus', roles: ['kitchen', 'admin', 'manager'] },
    { id: 'pending', label: 'Open orders', icon: 'ti-clock', roles: ['kitchen', 'admin', 'manager'] },
    { id: 'delivery', label: 'Receive goods', icon: 'ti-truck', roles: ['kitchen', 'admin', 'manager'] },
    { id: 'inventory', label: 'Inventory', icon: 'ti-clipboard-list', roles: ['kitchen', 'admin', 'manager'] },
    { id: 'info', label: 'Info', icon: 'ti-info-circle', roles: ['kitchen', 'admin', 'manager'] },
    { id: 'waste', label: 'Waste', icon: 'ti-trash', roles: ['kitchen', 'admin', 'manager'] },
    { id: 'invoice', label: 'Check invoice', icon: 'ti-file-check', roles: ['manager', 'admin'] },
    { id: 'products', label: 'Products', icon: 'ti-list', roles: ['admin'] },
  ];

  if (!token) return <SetupScreen onSave={setToken} />;
  if (!user) return <AccessCodeScreen staffApi={staffApi} onLogin={(u) => { setUser(u); setTab(u.role === 'manager' ? 'invoice' : (u.restaurant === 'Groenk Production Kitchen Fornalutx' ? 'prep' : 'new')); }} />;

  return (
    <div>
      <div className="app-header">
        <div className="app-header-top">
          <div>
           <div style={{ textAlign: 'center', flex: 1 }}>
  <h1 style={{ fontFamily: 'Fraunces, serif', fontSize: 28, letterSpacing: '0.08em', textTransform: 'uppercase', margin: 0 }}>Grøenk</h1>
  <div className="app-subtitle" style={{ textAlign: 'center' }}>Procurement · {user.name} · {user.restaurant}</div>
</div>
          </div>
          <button onClick={() => setUser(null)} style={{ fontSize: 11, padding: '6px 12px', minHeight: 32, background: 'rgba(255,255,255,0.15)', color: '#fff', borderColor: 'rgba(255,255,255,0.3)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>
            Sign out
          </button>
        </div>
        <div className="nav-scroll">
          {tabs.filter(t => t.roles.includes(user.role) && (!t.restaurants || t.restaurants.includes(user.restaurant))).map(t => (
            <button key={t.id} className={`nav-btn ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>
              <i className={`ti ${t.icon}`} style={{ fontSize: 15 }}></i>{t.label}
            </button>
          ))}
        </div>
      </div>
      {tab === 'prep' && <PrepScreen user={user} api={api} />}
      {tab === 'new' && <NewOrderScreen user={user} api={api} />}
      {tab === 'pending' && <PendingOrdersScreen user={user} api={api} />}
      {tab === 'delivery' && <DeliveryScreen user={user} api={api} />}
      {tab === 'inventory' && <InventoryScreen user={user} api={api} />}
      {tab === 'info' && <InfoScreen />}
      {tab === 'waste' && <WasteScreen user={user} api={api} />}
      {tab === 'invoice' && <InvoiceScreen api={api} />}
      {tab === 'products' && <ProductsScreen api={api} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>

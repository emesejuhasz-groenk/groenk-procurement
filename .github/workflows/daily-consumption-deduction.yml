name: Daily Stock Consumption Deduction

on:
  schedule:
    # Runs every 15 min, 04:00-04:45 UTC = 06:00-06:45 Madrid (CEST, summer) — i.e. the
    # 06:00-06:59 window. Stops before 07:00 so it never overlaps with the Production
    # Kitchen Order workflow's own 07:00-07:30 window (no simultaneous-tick race).
    # NOTE: tuned for CEST. Revisit in October when clocks go back to CET (see the
    # production-kitchen-order workflow for the same caveat) — until then this is fine.
    # Safe to run this often: the script is idempotent (only ever processes Daily Sales
    # records not yet marked "Stock Deducted"), so early ticks before the day's sales
    # have been imported are simply no-ops.
    - cron: '*/15 4 * * *'
  workflow_dispatch: {}

jobs:
  deduct-consumption:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./daily-consumption
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run daily consumption deduction script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: npm start

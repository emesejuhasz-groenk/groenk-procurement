name: Daily Stock Consumption Deduction

on:
  schedule:
    # Runs every 15 min, 04:00-06:29 UTC, every day.
    # This used to be a single fixed UTC time tuned for ~06:30 Madrid — but that drifts
    # by an hour across the DST changeover (CEST/CET), and could in principle run before
    # the ~06:00 Cowork import if Actions itself delays a single tick.
    # Safe to run this often: the script is idempotent (only ever processes Daily Sales
    # records not yet marked "Stock Deducted"), so early ticks before the day's sales
    # have been imported are simply no-ops.
    - cron: '*/15 4-6 * * *'
  workflow_dispatch: {}

jobs:
  deduct-consumption:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./daily-consumption
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run daily consumption deduction script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: npm start

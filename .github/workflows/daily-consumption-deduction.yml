name: Daily Stock Consumption Deduction

on:
  schedule:
    # WIDENED 2026-09-01: the tight 03:52-04:37 Madrid window (added 2026-08-30) assumed
    # GitHub Actions scheduled runs fire within minutes of their target time. In practice,
    # actual runs during Aug 29 - Sep 1 landed 5-6 HOURS late (e.g. scheduled for ~04:00
    # Madrid, actually ran 09:43, 10:35, 08:49, 09:44) - and on Aug 28, right after a cron
    # edit, the scheduled trigger never fired at all (documented GitHub Actions quirk: the
    # first window after a schedule change can be silently skipped while GitHub
    # re-registers it). A 45-minute window is too narrow for delays of this size.
    #
    # New window: every 15 min, 01:07-07:52 UTC = 03:07-09:52 Madrid (CEST, summer).
    # Costs nothing extra: the script is idempotent (only ever processes Daily Sales
    # records not yet marked "Stock Deducted"), so every tick before the day's sales
    # are imported, or after they're already deducted, is simply a no-op.
    # NOTE: tuned for CEST. Revisit in October when clocks go back to CET (see the
    # production-kitchen-order workflow for the same caveat) - until then this is fine.
    - cron: '7,22,37,52 1-7 * * *'
  workflow_dispatch: {}

jobs:
  deduct-consumption:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./daily-consumption
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run daily consumption deduction script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm start

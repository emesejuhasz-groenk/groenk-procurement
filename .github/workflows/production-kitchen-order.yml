name: Production Kitchen T+1 auto-order

on:
  schedule:
    # Runs every 15 min, 04:00-07:59 UTC, every day.
    # This used to be a single fixed UTC time, tuned to land at ~07:00 Madrid — but that
    # breaks across the DST changeover (CEST/CET are 1h apart) and GitHub Actions itself
    # can delay a single scheduled tick by hours under load (seen on 2026-08-27/28).
    #
    # Instead: run often, and let the script itself decide whether it's actually ready to
    # act — it checks that the Daily Stock Consumption Deduction job has already caught up
    # on today's Daily Sales data (see the script for details) before computing an order,
    # and checks GitHub's own run history to avoid sending more than one email per day.
    # Net effect: the real order+email happens on the first tick where the upstream data
    # is ready, whatever the season or whatever delay Actions itself introduces — no more
    # guessing fixed offsets between the import → deduction → order chain.
    - cron: '*/15 4-7 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Actually send the email to the kitchen (leave off for silent testing)'
        type: boolean
        default: false

jobs:
  send-order:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./production-kitchen-order
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run T+1 order script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SEND_EMAIL_OVERRIDE: ${{ github.event.inputs.send_email }}
        run: npm start

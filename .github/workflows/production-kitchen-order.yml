name: Production Kitchen T+1 auto-order

on:
  schedule:
    # Runs every 15 min, 05:00-05:30 UTC = 07:00-07:30 Madrid (CEST, summer) — unchanged
    # as of the 2026-08-30 timing rework. The Daily Stock Consumption Deduction workflow
    # now runs much earlier (01:45-02:30 UTC / 03:45-04:30 Madrid, right after HiOPOS +
    # the Cowork imports), so there's a large (~2.5h) safety buffer before this window
    # even starts — no overlapping/simultaneous ticks with Deduction.
    # NOTE: tuned for CEST. Revisit in October when clocks go back to CET — until then
    # this is fine.
    #
    # The script itself still decides whether it's actually ready to act — it checks
    # that the Daily Stock Consumption Deduction job has already caught up on today's
    # Daily Sales data before computing an order, and uses the Orders table (not GitHub
    # run history) to avoid sending more than one email per day. If the last tick
    # (05:30 UTC / 07:30 Madrid) still isn't ready, it sends a "missed" alert instead
    # of staying silent.
    - cron: '0,15,30 5 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Actually send the email to the kitchen (leave off for silent testing)'
        type: boolean
        default: false

jobs:
  send-order:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./production-kitchen-order
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run T+1 order script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SEND_EMAIL_OVERRIDE: ${{ github.event.inputs.send_email }}
        run: npm start

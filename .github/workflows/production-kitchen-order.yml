name: Production Kitchen T+1 auto-order

on:
  schedule:
    # Primary morning run: 04:47 UTC = 06:47 Madrid (CEST, summer) / 05:47 (CET, winter).
    # Backup run ~30 min later: 05:17 UTC = 07:17 CEST / 06:17 CET, in case the primary
    # is delayed or skipped by GitHub Actions (this has happened — see 2026-08-27/28).
    # Deliberately NOT on a round hour/half-hour: GitHub's own docs note that scheduled
    # workflows are most likely to be delayed right at the top of the hour, when many
    # repos' cron jobs fire at once.
    #
    # NOTE ON DST: these UTC times are tuned for CEST (summer). In winter (CET, UTC+1)
    # both runs will land about an hour earlier in Madrid local time. If exact local
    # time matters year-round, this needs seasonal cron lines or a check inside the
    # script — not implemented yet.
    - cron: '47 4 * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Actually send the email to the kitchen (leave off for silent testing)'
        type: boolean
        default: false

jobs:
  send-order:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./production-kitchen-order
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run T+1 order script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SEND_EMAIL_OVERRIDE: ${{ github.event.inputs.send_email }}
          # Built-in token, used only to read this workflow's own run history (to detect
          # whether the primary run already succeeded before the backup run fires).
          # No extra secret setup needed — GitHub provides this automatically.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm start

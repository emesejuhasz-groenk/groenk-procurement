name: Production Kitchen T+1 auto-order

on:
  schedule:
    # 07:00 in Madrid (CEST, UTC+2) = 05:00 UTC.
    # NOTE: Spain is UTC+1 (CET) in winter — during that period this will
    # actually fire at 06:00 Madrid time, not 07:00. GitHub Actions cron
    # cannot shift automatically for daylight saving. If exact 07:00 local
    # time matters year-round, this needs two cron lines (one for summer,
    # one for winter) or a small time check inside the script that exits
    # early outside the intended local hour.
    - cron: '0 5 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  send-order:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./production-kitchen-order
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run T+1 order script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm start

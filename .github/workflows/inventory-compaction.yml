name: Inventory Weekly Archive
# Every Monday: keeps the current week + the last 2 completed weeks of
# Inventory Transactions as individual rows; older history is collapsed into
# one "Opening balance" row per product + location with exactly the same stock
# effect, after the archive CSV has been saved and verified in the controlling
# Drive folder. See inventory-compaction/inventory-compaction.js for the rules.
on:
  schedule:
    # Monday 08:30 UTC = 10:30 Madrid (CEST): after the weekly reports
    # (04:30/06:00 UTC), the Daily Sales archive (07:30 UTC) and the end of the
    # daily consumption window (01:00-08:00 UTC).
    - cron: '30 8 * * 1'
    # Safety-net tick (GitHub can skip a new schedule's first window). Safe to
    # run twice: the second run finds nothing left to archive.
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = plan + archive + email only, change nothing'
        type: choice
        options: ['true', 'false']
        default: 'true'
jobs:
  archive:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inventory-compaction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run inventory archive
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: npm start

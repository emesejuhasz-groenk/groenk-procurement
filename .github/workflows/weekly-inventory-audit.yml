name: Weekly Inventory Audit

on:
  schedule:
    # 12:00 Madrid (CEST, UTC+2) = 10:00 UTC, every Friday.
    #
    # Timing logic (2026-08-27): staff arrive at 11:00 and their first task is
    # entering the physical count into the app ("Update count") — BEFORE any
    # same-day receiving/waste/prep, so the comparison is against a clean,
    # settled ledger (06:30 Daily Consumption Deduction already ran, nothing
    # new since). Counting takes about an hour, so the audit runs at 12:00,
    # giving staff the full 11:00-12:00 window; goods receiving for the day
    # then runs 12:00-17:00 as usual.
    # NOTE: same DST caveat as the other scheduled workflows - in winter
    # (CET, UTC+1) this will actually fire at 11:00 Madrid time, not 12:00.
    - cron: '0 10 * * 5'
  workflow_dispatch: {}

jobs:
  send-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inventory-audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run weekly audit script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm start
